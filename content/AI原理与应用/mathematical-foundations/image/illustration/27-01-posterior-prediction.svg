<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">后验预测：参数仍不确定，新观测也有随机性</title>
<desc id="desc">后验参数分布先给出一个参数，再按该参数的观测分布生成未来计数，重复得到后验预测。积分公式则对条件分布求后验平均。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536B8D"/></marker></defs>
<rect width="1000" height="440" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#20365F">
<text x="500.0" y="38" text-anchor="middle" font-size="26" fill="#20365F" font-weight="600">后验预测：参数仍不确定，新观测也有随机性</text>
<rect x="55" y="110" width="250" height="108" rx="12" fill="#ECF3FF" stroke="#3265D6" stroke-width="1.8"/>
<text x="180.0" y="156.5" text-anchor="middle" font-size="23" fill="#20365F" font-weight="400">参数后验</text>
<text x="180.0" y="185.5" text-anchor="middle" font-size="23" fill="#20365F" font-weight="400">θ ∼ Beta(A, B)</text>
<line x1="318" y1="164" x2="367" y2="164" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="110" width="250" height="108" rx="12" fill="#EFF8F4" stroke="#4A9479" stroke-width="1.8"/>
<text x="505.0" y="156.5" text-anchor="middle" font-size="21" fill="#20365F" font-weight="400">抽一次参数 θ</text>
<text x="505.0" y="185.5" text-anchor="middle" font-size="21" fill="#20365F" font-weight="400">本轮条件固定</text>
<line x1="643" y1="164" x2="692" y2="164" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="705" y="110" width="250" height="108" rx="12" fill="#F3F0FF" stroke="#8B78C7" stroke-width="1.8"/>
<text x="830.0" y="156.5" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">新计数 K</text>
<text x="830.0" y="185.5" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">K | θ ∼ Binomial(m, θ)</text>
<path d="M831 227 L831 290 L181 290 L181 228" fill="none" stroke="#536B8D" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="500" y="326" text-anchor="middle" font-size="22" fill="#20365F" font-weight="400">重复两步，得到后验预测的模拟样本</text>
<text x="500" y="373" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">积分计算：对每个 θ 下的条件分布按后验概率加权。</text>
<text x="500" y="410" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">用后验均值代替全部 θ，通常不能保留多次预测的完整不确定性。</text>
</g>
</svg>
