<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">二维方程组：解是两条直线的公共点</title>
<desc id="desc">唯一解对应交点，无穷解对应重合直线，无解对应平行而不重合。三幅图使用正文同一组方程。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536B8D"/></marker></defs>
<rect width="1000" height="470" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#20365F">
<text x="500.0" y="38" text-anchor="middle" font-size="26" fill="#20365F" font-weight="600">二维方程组：解是两条直线的公共点</text>
<text x="177" y="92" text-anchor="middle" font-size="23" fill="#20365F" font-weight="400">唯一解</text>
<line x1="52" y1="341" x2="303" y2="341" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="62" y1="351" x2="62" y2="116" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="306" y="365" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">x₁</text>
<text x="52" y="107" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">x₂</text>
<line x1="62" y1="176" x2="227" y2="341" stroke="#3265D6" stroke-width="3"/>
<line x1="62" y1="341" x2="166.5" y2="132.0" stroke="#4A9479" stroke-width="3"/>
<circle cx="117" cy="231" r="5" fill="#3265D6" stroke="#3265D6" stroke-width="2"/>
<text x="172" y="220.0" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">(1, 2)</text>
<text x="178" y="392" text-anchor="middle" font-size="18" fill="#3265D6" font-weight="400">x₁ + x₂ = 3</text>
<text x="178" y="425" text-anchor="middle" font-size="18" fill="#4A9479" font-weight="400">2x₁ − x₂ = 0</text>
<text x="503" y="92" text-anchor="middle" font-size="23" fill="#20365F" font-weight="400">无穷多解</text>
<line x1="378" y1="341" x2="629" y2="341" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="388" y1="351" x2="388" y2="116" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="632" y="365" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">x₁</text>
<text x="378" y="107" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">x₂</text>
<line x1="388" y1="176" x2="553" y2="341" stroke="#3265D6" stroke-width="3"/>
<line x1="388" y1="176" x2="553" y2="341" stroke="#4A9479" stroke-width="3" stroke-dasharray="6 5"/>
<text x="504" y="392" text-anchor="middle" font-size="18" fill="#3265D6" font-weight="400">x₁ + x₂ = 3</text>
<text x="504" y="425" text-anchor="middle" font-size="18" fill="#4A9479" font-weight="400">2x₁ + 2x₂ = 6</text>
<text x="829" y="92" text-anchor="middle" font-size="23" fill="#20365F" font-weight="400">无解</text>
<line x1="704" y1="341" x2="955" y2="341" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="714" y1="351" x2="714" y2="116" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="958" y="365" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">x₁</text>
<text x="704" y="107" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">x₂</text>
<line x1="714" y1="176" x2="879" y2="341" stroke="#3265D6" stroke-width="3"/>
<line x1="714" y1="148.5" x2="906.5" y2="341" stroke="#4A9479" stroke-width="3"/>
<text x="830" y="392" text-anchor="middle" font-size="18" fill="#3265D6" font-weight="400">x₁ + x₂ = 3</text>
<text x="830" y="425" text-anchor="middle" font-size="18" fill="#4A9479" font-weight="400">2x₁ + 2x₂ = 7</text>
<text x="500" y="458" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">直线只画局部；一般高维系统仍用相容条件与秩判断。</text>
</g>
</svg>
