<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">每组样本量 n，与重复次数 R 是两个方向</title>
<desc id="desc">每行是一组独立样本，每行含n个观测，沿行求均值得R个均值，再观察这些均值的分布。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536B8D"/></marker></defs>
<rect width="1000" height="450" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#20365F">
<text x="500.0" y="38" text-anchor="middle" font-size="26" fill="#20365F" font-weight="600">每组样本量 n，与重复次数 R 是两个方向</text>
<text x="353" y="103" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">每行 n 个观测</text>
<rect x="130" y="135" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="180.0" y="166.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">x₁₁</text>
<rect x="230" y="135" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="280.0" y="166.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">x₁₂</text>
<rect x="330" y="135" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="380.0" y="166.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">…</text>
<rect x="430" y="135" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="480.0" y="166.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">x₁ₙ</text>
<rect x="130" y="183" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="180.0" y="214.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">x₂₁</text>
<rect x="230" y="183" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="280.0" y="214.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">x₂₂</text>
<rect x="330" y="183" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="380.0" y="214.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">…</text>
<rect x="430" y="183" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="480.0" y="214.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">x₂ₙ</text>
<rect x="130" y="231" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="180.0" y="262.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">⋮</text>
<rect x="230" y="231" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="280.0" y="262.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">⋮</text>
<rect x="330" y="231" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="380.0" y="262.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">⋮</text>
<rect x="430" y="231" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="480.0" y="262.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">⋮</text>
<rect x="130" y="279" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="180.0" y="310.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">x<tspan baseline-shift="sub" font-size="14">R1</tspan></text>
<rect x="230" y="279" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="280.0" y="310.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">x<tspan baseline-shift="sub" font-size="14">R2</tspan></text>
<rect x="330" y="279" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="380.0" y="310.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">…</text>
<rect x="430" y="279" width="100" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="480.0" y="310.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">x<tspan baseline-shift="sub" font-size="14">Rn</tspan></text>
<text x="71" y="229" text-anchor="middle" font-size="21" fill="#20365F" font-weight="400">R 组</text>
<line x1="95" y1="138" x2="95" y2="325" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="550" y1="227" x2="630" y2="227" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="589" y="198" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">行均值</text>
<rect x="650" y="135" width="100" height="48" rx="0" fill="#EFF8F4" stroke="#91AAD8" stroke-width="1.8"/>
<text x="700.0" y="166.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">x̄₁</text>
<rect x="650" y="183" width="100" height="48" rx="0" fill="#EFF8F4" stroke="#91AAD8" stroke-width="1.8"/>
<text x="700.0" y="214.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">x̄₂</text>
<rect x="650" y="231" width="100" height="48" rx="0" fill="#EFF8F4" stroke="#91AAD8" stroke-width="1.8"/>
<text x="700.0" y="262.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">⋮</text>
<rect x="650" y="279" width="100" height="48" rx="0" fill="#EFF8F4" stroke="#91AAD8" stroke-width="1.8"/>
<text x="700.0" y="310.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">x̄<tspan baseline-shift="sub" font-size="14">R</tspan></text>
<line x1="770" y1="227" x2="831" y2="227" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="846" y="147" width="125" height="162" rx="12" fill="#F3F0FF" stroke="#8B78C7" stroke-width="1.8"/>
<text x="908.5" y="220.5" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">R 个均值</text>
<text x="908.5" y="249.5" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">的分布</text>
<text x="500" y="378" text-anchor="middle" font-size="22" fill="#20365F" font-weight="400">增大 n：改变每个均值的抽样分布。</text>
<text x="500" y="418" text-anchor="middle" font-size="21" fill="#20365F" font-weight="400">增大 R：在固定 n 下，把该分布观察得更充分。</text>
</g>
</svg>
