<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">从高层规范到浏览器中的图表</title>
<desc id="desc">Vega-Lite规范编译为Vega规范，再由Vega运行时渲染至容器；Vega-Embed负责网页嵌入和协调这些步骤，不是下一种规范。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536B8D"/></marker></defs>
<rect width="1000" height="420" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#20365F">
<text x="500.0" y="38" text-anchor="middle" font-size="26" fill="#20365F" font-weight="600">从高层规范到浏览器中的图表</text>
<rect x="38" y="103" width="923" height="219" rx="17" fill="#FAFCFF" stroke="#3265D6" stroke-width="1.8"/>
<text x="500" y="138" text-anchor="middle" font-size="22" fill="#20365F" font-weight="400">Vega-Embed：接收容器与规范，组织网页嵌入</text>
<rect x="70" y="182" width="240" height="98" rx="12" fill="#ECF3FF" stroke="#3265D6" stroke-width="1.8"/>
<text x="190.0" y="223.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">Vega-Lite 规范</text>
<text x="190.0" y="252.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">data / mark / encoding</text>
<rect x="380" y="182" width="240" height="98" rx="12" fill="#EFF8F4" stroke="#4A9479" stroke-width="1.8"/>
<text x="500.0" y="223.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">Vega 规范</text>
<text x="500.0" y="252.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">marks / scales / axes</text>
<rect x="690" y="182" width="240" height="98" rx="12" fill="#F3F0FF" stroke="#8B78C7" stroke-width="1.8"/>
<text x="810.0" y="223.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">Vega 运行时</text>
<text x="810.0" y="252.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">绘制到 HTML 容器</text>
<line x1="320" y1="230" x2="370" y2="230" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="345" y="173" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">编译</text>
<line x1="630" y1="230" x2="680" y2="230" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="655" y="173" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">运行</text>
<text x="500" y="360" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">修改图形定义：改高层规范；安排页面位置与加载：看嵌入代码。</text>
<text x="500" y="398" text-anchor="middle" font-size="18" fill="#536B8D" font-weight="400">静态转换单元不需要网页容器；本图概括后续浏览器嵌入路径。</text>
</g>
</svg>
