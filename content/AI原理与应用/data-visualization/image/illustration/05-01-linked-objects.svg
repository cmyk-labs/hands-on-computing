<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">Bokeh 联动：共享的是对象，不是外观</title>
<desc id="desc">两图共享同一个ColumnDataSource使选择联动，共享同一个y_range使纵轴范围联动，横轴功率与质量各自独立。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536B8D"/></marker></defs>
<rect width="1000" height="450" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#20365F">
<text x="500.0" y="38" text-anchor="middle" font-size="26" fill="#20365F" font-weight="600">Bokeh 联动：共享的是对象，不是外观</text>
<rect x="70" y="83" width="360" height="81" rx="12" fill="#ECF3FF" stroke="#3265D6" stroke-width="1.8"/>
<text x="250.0" y="116.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">同一个 ColumnDataSource</text>
<text x="250.0" y="145.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">linked_source：共享记录与选择</text>
<rect x="570" y="83" width="360" height="81" rx="12" fill="#EFF8F4" stroke="#4A9479" stroke-width="1.8"/>
<text x="750.0" y="116.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">同一个 y_range</text>
<text x="750.0" y="145.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">共享温度轴范围</text>
<line x1="250" y1="176" x2="245" y2="249" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="250" y1="176" x2="755" y2="249" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="750" y1="176" x2="245" y2="249" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="750" y1="176" x2="755" y2="249" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="260" width="360" height="111" rx="12" fill="#ECF3FF" stroke="#3265D6" stroke-width="1.8"/>
<text x="245.0" y="293.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">left：功率 × 温度</text>
<text x="245.0" y="322.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">x_range：功率（W）</text>
<text x="245.0" y="351.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">source=linked_source</text>
<rect x="575" y="260" width="360" height="111" rx="12" fill="#EFF8F4" stroke="#4A9479" stroke-width="1.8"/>
<text x="755.0" y="293.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">right：质量 × 温度</text>
<text x="755.0" y="322.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">x_range：质量（g）</text>
<text x="755.0" y="351.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">source=linked_source</text>
<text x="500" y="411" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">框选看共享数据源，纵向缩放看共享范围；row() 只安排位置。</text>
</g>
</svg>
