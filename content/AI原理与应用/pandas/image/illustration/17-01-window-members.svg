<text x="500.0" y="38" text-anchor="middle" font-size="26" fill="#20365F" font-weight="600">窗口成员：最近几行与最近几分钟不是同一回事</text>
<text x="500" y="123" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">09:09 的 rolling(3)：最近 3 行</text>
