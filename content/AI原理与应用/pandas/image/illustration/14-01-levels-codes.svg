<text x="500" y="410" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">逐行标签由每层编码共同确定；levels 本身不是逐行展开的标签。</text>
<text x="500" y="445" text-anchor="middle" font-size="17" fill="#536B8D" font-weight="400">右列省略共同年份 2026；codes 中的 −1 表示缺失，并非倒数索引。</text>
