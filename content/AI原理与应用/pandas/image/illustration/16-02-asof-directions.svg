<path d="M796 146 Q692.0 92 588 146" fill="none" stroke="#3265D6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="665" y="110" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">历史 4 分钟 → 10:04</text>
<text x="123" y="287" text-anchor="middle" font-size="23" fill="#20365F" font-weight="400">forward</text>
