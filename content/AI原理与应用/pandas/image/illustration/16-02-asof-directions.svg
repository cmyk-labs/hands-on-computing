<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">merge_asof：最近记录可能位于事件之后</title>
<desc id="desc">事件10:08，测量10:00、10:04和10:10，backward选择10:04，forward和nearest选择10:10。</desc>
