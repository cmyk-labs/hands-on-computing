<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">pandas 3：别名与派生对象的修改范围不同</title>
<desc id="desc">左图两个名称对应同一个表；右图列选择生成派生 Series，经过 pandas 赋值后列与表的修改隔离。此图只表达可见行为。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536B8D"/></marker></defs>
<rect width="1000" height="450" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#20365F">
<text x="500.0" y="38" text-anchor="middle" font-size="26" fill="#20365F" font-weight="600">pandas 3：别名与派生对象的修改范围不同</text>
<text x="235" y="95" text-anchor="middle" font-size="21" fill="#20365F" font-weight="400">同一个对象：alias = table</text>
<rect x="60" y="130" width="135" height="55" rx="12" fill="#ECF3FF" stroke="#3265D6" stroke-width="1.8"/>
<text x="127.5" y="164.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">table</text>
<rect x="270" y="130" width="135" height="55" rx="12" fill="#ECF3FF" stroke="#3265D6" stroke-width="1.8"/>
<text x="337.5" y="164.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">alias</text>
<path d="M128 185 L128 222 L235 222 L235 255" fill="none" stroke="#536B8D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M337 185 L337 222 L235 222" fill="none" stroke="#536B8D" stroke-width="2.5"/>
<rect x="125" y="265" width="220" height="85" rx="12" fill="#ECF3FF" stroke="#3265D6" stroke-width="1.8"/>
<text x="235.0" y="300.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">一张 DataFrame</text>
<text x="235.0" y="329.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">A = 99；B = 20</text>
<text x="235" y="390" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">通过 alias 写入，table 也看到变化</text>
<line x1="477" y1="80" x2="477" y2="407" stroke="#D3DEEE" stroke-width="2"/>
<text x="740" y="95" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">两个对象：column = table[&quot;value&quot;]</text>
<rect x="548" y="132" width="173" height="90" rx="12" fill="#ECF3FF" stroke="#3265D6" stroke-width="1.8"/>
<text x="634.5" y="169.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">table</text>
<text x="634.5" y="198.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">A = 10；B = 20</text>
<rect x="760" y="132" width="184" height="90" rx="12" fill="#EFF8F4" stroke="#4A9479" stroke-width="1.8"/>
<text x="852.0" y="169.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">column</text>
<text x="852.0" y="198.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">A = 10；B = 20</text>
<line x1="635" y1="226" x2="635" y2="277" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="852" y1="226" x2="852" y2="277" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="548" y="285" width="173" height="80" rx="12" fill="#ECF3FF" stroke="#3265D6" stroke-width="1.8"/>
<text x="634.5" y="317.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">table 写 B = 88</text>
<text x="634.5" y="346.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">[10, 88]</text>
<rect x="760" y="285" width="184" height="80" rx="12" fill="#EFF8F4" stroke="#4A9479" stroke-width="1.8"/>
<text x="852.0" y="317.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">column 写 A = 99</text>
<text x="852.0" y="346.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">[99, 20]</text>
<text x="742" y="408" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">修改隔离；不据此推断内部缓冲区的即时布局</text>
</g>
</svg>
