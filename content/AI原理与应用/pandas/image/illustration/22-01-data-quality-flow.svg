<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
<title id="title">订单处理：合格数据进入汇总，问题记录保留来源</title>
<desc id="desc">原始订单与明细经过规范化、校验去重、关系连接后形成accepted明细，异常和未匹配记录进入问题表；事件另按时间关联订单摘要。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536B8D"/></marker></defs>
<rect width="1000" height="580" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#20365F">
<text x="500.0" y="38" text-anchor="middle" font-size="26" fill="#20365F" font-weight="600">订单处理：合格数据进入汇总，问题记录保留来源</text>
<rect x="35" y="90" width="195" height="88" rx="12" fill="#ECF3FF" stroke="#3265D6" stroke-width="1.8"/>
<text x="132.5" y="126.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">原始订单 / 明细</text>
<text x="132.5" y="155.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">保留 source_row</text>
<rect x="285" y="90" width="195" height="88" rx="12" fill="#ECF3FF" stroke="#3265D6" stroke-width="1.8"/>
<text x="382.5" y="126.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">规范化与校验</text>
<text x="382.5" y="155.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">键、时间、整数金额</text>
<rect x="535" y="90" width="195" height="88" rx="12" fill="#ECF3FF" stroke="#3265D6" stroke-width="1.8"/>
<text x="632.5" y="126.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">去重并连接</text>
<text x="632.5" y="155.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">明细 → 唯一订单</text>
<rect x="785" y="90" width="180" height="88" rx="12" fill="#EFF8F4" stroke="#4A9479" stroke-width="1.8"/>
<text x="875.0" y="126.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">accepted 明细</text>
<text x="875.0" y="155.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">本例 4 条</text>
<line x1="230" y1="134" x2="277" y2="134" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="480" y1="134" x2="527" y2="134" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="730" y1="134" x2="777" y2="134" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M382 178 L382 226 L650 226 L650 239" fill="none" stroke="#536B8D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M632 178 L632 211 L735 211 L735 239" fill="none" stroke="#536B8D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="535" y="247" width="385" height="82" rx="12" fill="#F3F0FF" stroke="#8B78C7" stroke-width="1.8"/>
<text x="727.5" y="280.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">问题记录：原行号、键、原因、原值</text>
<text x="727.5" y="309.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">非法明细与未匹配键可回查</text>
<path d="M875 178 L967 178 L967 365 L705 365 L705 392" fill="none" stroke="#536B8D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="540" y="403" width="330" height="85" rx="12" fill="#EFF8F4" stroke="#4A9479" stroke-width="1.8"/>
<text x="705.0" y="438.0" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">按订单 / 客户与分类汇总</text>
<text x="705.0" y="467.0" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">accepted_cents 仅计接受的金额</text>
<rect x="35" y="391" width="195" height="88" rx="12" fill="#ECF3FF" stroke="#3265D6" stroke-width="1.8"/>
<text x="132.5" y="427.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">事件记录</text>
<text x="132.5" y="456.5" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">统一 UTC 并排序</text>
<rect x="285" y="391" width="200" height="88" rx="12" fill="#ECF3FF" stroke="#3265D6" stroke-width="1.8"/>
<text x="385.0" y="427.5" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">订单时间关联</text>
<text x="385.0" y="456.5" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">严格早于且 ≤ 5 分钟</text>
<line x1="230" y1="435" x2="277" y2="435" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="540" y1="435" x2="493" y2="435" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="548" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">订单摘要保留需复核标记；缺少有效明细不等于真实金额为零。</text>
</g>
</svg>
