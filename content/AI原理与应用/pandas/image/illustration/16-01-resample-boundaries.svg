<text x="788" y="145" text-anchor="middle" font-size="20" fill="#4A9479" font-weight="400">标签 10:00；总和 3</text>
<text x="488" y="160" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">[10:00, 10:05)</text>
<text x="183" y="281" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">closed=left；label=right</text>
<line x1="360" y1="323" x2="915" y2="323" stroke="#BAC8DC" stroke-width="2"/>
