<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
<title id="title">重采样：先决定桶成员，再决定结果标签</title>
<desc id="desc">在十点零分到五分之间，左闭桶含十点零与四分，总和三；只改标签仍为三，右闭则含四分与五分，总和六。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536B8D"/></marker></defs>
<rect width="1000" height="530" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#20365F">
<text x="500.0" y="38" text-anchor="middle" font-size="26" fill="#20365F" font-weight="600">重采样：先决定桶成员，再决定结果标签</text>
<text x="500" y="86" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">观测：10:00→1，10:04→2，10:05→4，10:09→8，10:10→16</text>
<text x="183" y="136" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">closed=left；label=left</text>
