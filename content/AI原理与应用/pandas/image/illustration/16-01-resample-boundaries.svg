<text x="620" y="205" text-anchor="middle" font-size="15" fill="#20365F" font-weight="400">10:05</text>
<text x="828" y="205" text-anchor="middle" font-size="15" fill="#20365F" font-weight="400">10:09</text>
<text x="880" y="205" text-anchor="middle" font-size="15" fill="#20365F" font-weight="400">10:10</text>
<circle cx="360" cy="178" r="7" fill="#3265D6" stroke="#3265D6" stroke-width="2"/>
<circle cx="568" cy="178" r="5" fill="#3265D6" stroke="#3265D6" stroke-width="2"/>
<circle cx="620" cy="178" r="7" fill="white" stroke="#3265D6" stroke-width="2"/>
