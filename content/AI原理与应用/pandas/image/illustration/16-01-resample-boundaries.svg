<text x="788" y="435" text-anchor="middle" font-size="20" fill="#4A9479" font-weight="400">标签 10:05；总和 6</text>
<text x="488" y="450" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">(10:00, 10:05]</text>
<text x="500" y="521" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">图只突出同一对边界之间的桶；完整输出还包含其他桶。</text>
