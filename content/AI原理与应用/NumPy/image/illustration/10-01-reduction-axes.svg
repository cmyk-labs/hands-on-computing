<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">axis 指定被汇总的轴</title>
<desc id="desc">二天三站点的数组沿天数轴求和得到三个站点总和，沿站点轴求和得到每天总量；keepdims 保留长度一的轴。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536B8D"/></marker></defs>
<rect width="1000" height="450" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#20365F">
<text x="500.0" y="38" text-anchor="middle" font-size="26" fill="#20365F" font-weight="600">axis 指定被汇总的轴</text>
<text x="260" y="100" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">counts：2 天 × 3 个站点</text>
<rect x="170" y="127" width="65" height="50" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="202.5" y="159.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">2</text>
<rect x="235" y="127" width="65" height="50" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="267.5" y="159.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">4</text>
<rect x="300" y="127" width="65" height="50" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="332.5" y="159.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">6</text>
<rect x="170" y="177" width="65" height="50" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="202.5" y="209.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">4</text>
<rect x="235" y="177" width="65" height="50" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="267.5" y="209.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">8</text>
<rect x="300" y="177" width="65" height="50" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="332.5" y="209.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">12</text>
<line x1="202.5" y1="235" x2="202.5" y2="302" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="267.5" y1="235" x2="267.5" y2="302" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="332.5" y1="235" x2="332.5" y2="302" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="170" y="315" width="65" height="46" rx="0" fill="#EFF8F4" stroke="#91AAD8" stroke-width="1.8"/>
<text x="202.5" y="345.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">6</text>
<rect x="235" y="315" width="65" height="46" rx="0" fill="#EFF8F4" stroke="#91AAD8" stroke-width="1.8"/>
<text x="267.5" y="345.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">12</text>
<rect x="300" y="315" width="65" height="46" rx="0" fill="#EFF8F4" stroke="#91AAD8" stroke-width="1.8"/>
<text x="332.5" y="345.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">18</text>
<text x="267" y="283" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">sum(axis=0)</text>
<text x="267" y="390" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">(3,)：保留站点轴</text>
<line x1="390" y1="178" x2="535" y2="178" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="459" y="154" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">axis=1</text>
<rect x="570" y="127" width="64" height="50" rx="0" fill="#F3F0FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="602.0" y="159.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">12</text>
<rect x="570" y="177" width="64" height="50" rx="0" fill="#F3F0FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="602.0" y="209.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">24</text>
<text x="750" y="152" text-anchor="middle" font-size="21" fill="#20365F" font-weight="400">sum → (2,)</text>
<text x="755" y="195" text-anchor="middle" font-size="17" fill="#536B8D" font-weight="400">图中竖排只是方便对应两天</text>
<rect x="537" y="285" width="398" height="82" rx="12" fill="#F3F0FF" stroke="#8B78C7" stroke-width="1.8"/>
<text x="736.0" y="318.5" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">mean(axis=1, keepdims=True)</text>
<text x="736.0" y="347.5" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">[[4], [8]] → shape (2, 1)</text>
<text x="737" y="403" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">保留长度 1 的站点轴，便于相减广播</text>
</g>
</svg>
