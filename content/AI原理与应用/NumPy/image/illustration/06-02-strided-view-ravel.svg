<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">相同数值，可以对应不同的内存布局</title>
<desc id="desc">int16原数组零至十一，每元素两字节；每隔一列选择后reshape保留四字节步幅，ravel复制到连续的新缓冲区。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536B8D"/></marker></defs>
<rect width="1000" height="460" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#20365F">
<text x="500.0" y="38" text-anchor="middle" font-size="26" fill="#20365F" font-weight="600">相同数值，可以对应不同的内存布局</text>
<text x="500" y="86" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">table = arange(12, dtype=int16).reshape(3, 4)；每元素 2 字节</text>
<rect x="80" y="110" width="70" height="45" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="115.0" y="139.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">0</text>
<rect x="150" y="110" width="70" height="45" rx="0" fill="#FAFCFF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="185.0" y="139.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">1</text>
<rect x="220" y="110" width="70" height="45" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="255.0" y="139.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">2</text>
<rect x="290" y="110" width="70" height="45" rx="0" fill="#FAFCFF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="325.0" y="139.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">3</text>
<rect x="360" y="110" width="70" height="45" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="395.0" y="139.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">4</text>
<rect x="430" y="110" width="70" height="45" rx="0" fill="#FAFCFF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="465.0" y="139.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">5</text>
<rect x="500" y="110" width="70" height="45" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="535.0" y="139.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">6</text>
<rect x="570" y="110" width="70" height="45" rx="0" fill="#FAFCFF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="605.0" y="139.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">7</text>
<rect x="640" y="110" width="70" height="45" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="675.0" y="139.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">8</text>
<rect x="710" y="110" width="70" height="45" rx="0" fill="#FAFCFF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="745.0" y="139.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">9</text>
<rect x="780" y="110" width="70" height="45" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="815.0" y="139.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">10</text>
<rect x="850" y="110" width="70" height="45" rx="0" fill="#FAFCFF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="885.0" y="139.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">11</text>
<text x="115" y="181" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">0</text>
<text x="185" y="181" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">2</text>
<text x="255" y="181" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">4</text>
<text x="325" y="181" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">6</text>
<text x="395" y="181" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">8</text>
<text x="465" y="181" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">10</text>
<text x="535" y="181" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">12</text>
<text x="605" y="181" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">14</text>
<text x="675" y="181" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">16</text>
<text x="745" y="181" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">18</text>
<text x="815" y="181" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">20</text>
<text x="885" y="181" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">22</text>
<text x="500" y="212" text-anchor="middle" font-size="17" fill="#536B8D" font-weight="400">上方数字是原缓冲区内的字节偏移</text>
<text x="500" y="259" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">table[:, ::2].reshape(-1)：仍引用蓝色位置，步幅为 4 字节</text>
<text x="500" y="306" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">table[:, ::2].ravel()：复制选中值到连续的新缓冲区</text>
<rect x="80" y="328" width="80" height="45" rx="0" fill="#EFF8F4" stroke="#91AAD8" stroke-width="1.8"/>
<text x="120.0" y="357.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">0</text>
<rect x="160" y="328" width="80" height="45" rx="0" fill="#EFF8F4" stroke="#91AAD8" stroke-width="1.8"/>
<text x="200.0" y="357.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">2</text>
<rect x="240" y="328" width="80" height="45" rx="0" fill="#EFF8F4" stroke="#91AAD8" stroke-width="1.8"/>
<text x="280.0" y="357.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">4</text>
<rect x="320" y="328" width="80" height="45" rx="0" fill="#EFF8F4" stroke="#91AAD8" stroke-width="1.8"/>
<text x="360.0" y="357.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">6</text>
<rect x="400" y="328" width="80" height="45" rx="0" fill="#EFF8F4" stroke="#91AAD8" stroke-width="1.8"/>
<text x="440.0" y="357.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">8</text>
<rect x="480" y="328" width="80" height="45" rx="0" fill="#EFF8F4" stroke="#91AAD8" stroke-width="1.8"/>
<text x="520.0" y="357.5" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">10</text>
<text x="120" y="402" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">0</text>
<text x="200" y="402" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">2</text>
<text x="280" y="402" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">4</text>
<text x="360" y="402" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">6</text>
<text x="440" y="402" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">8</text>
<text x="520" y="402" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">10</text>
<text x="755" y="354" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">新缓冲区的步幅为 2 字节</text>
<text x="500" y="444" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">偏移相对于各自缓冲区起点；布局只表示本例 int16 输入。</text>
</g>
</svg>
