<text x="775" y="111" text-anchor="middle" font-size="22" fill="#3265D6" font-weight="400">table.T</text>
<text x="775" y="147" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">原第 i 行、第 j 列 → 第 j 行、第 i 列</text>
<text x="775" y="286" text-anchor="middle" font-size="22" fill="#4A9479" font-weight="400">table.reshape(3, 2)</text>
<text x="775" y="323" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">按 10、11、12、20、21、22 重新分组</text>
<text x="500" y="409" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">两者 shape 都是 (3, 2)，仍要核对值与位置的对应关系。</text>
</g>
