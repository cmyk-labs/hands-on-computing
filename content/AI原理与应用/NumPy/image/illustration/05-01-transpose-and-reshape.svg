<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">转置交换坐标，reshape 重新分组</title>
<desc id="desc">同一个二行三列数组，经转置和默认 C 顺序 reshape 后均为三行二列，但元素位置不同。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536B8D"/></marker></defs>
<rect width="1000" height="430" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#20365F">
<text x="500.0" y="38" text-anchor="middle" font-size="26" fill="#20365F" font-weight="600">转置交换坐标，reshape 重新分组</text>
<rect x="65" y="165" width="62" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="96.0" y="196.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">10</text>
<rect x="127" y="165" width="62" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
