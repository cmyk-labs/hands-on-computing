<rect x="525" y="155" width="60" height="40" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="555.0" y="182.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">22</text>
