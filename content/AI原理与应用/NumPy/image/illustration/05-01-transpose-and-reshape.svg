<text x="220.0" y="196.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">12</text>
<rect x="65" y="213" width="62" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="96.0" y="244.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">20</text>
<rect x="127" y="213" width="62" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="158.0" y="244.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">21</text>
<rect x="189" y="213" width="62" height="48" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="220.0" y="244.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">22</text>
<text x="158" y="137" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">table：(2, 3)</text>
<path d="M270 204 L340 204 L340 118 L430 118" fill="none" stroke="#536B8D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M340 204 L340 300 L430 300" fill="none" stroke="#536B8D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="465" y="75" width="60" height="40" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="495.0" y="102.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">10</text>
<rect x="525" y="75" width="60" height="40" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
<text x="555.0" y="102.0" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">20</text>
<rect x="465" y="115" width="60" height="40" rx="0" fill="#ECF3FF" stroke="#91AAD8" stroke-width="1.8"/>
