<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">domain 与 window：同一个位置的两套坐标</title>
<desc id="desc">原坐标十到十三映射到负一到一；中心十一点五映射到零。拟合对象接受原坐标，但系数对应映射变量。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536B8D"/></marker></defs>
<rect width="1000" height="400" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#20365F">
<text x="500.0" y="38" text-anchor="middle" font-size="26" fill="#20365F" font-weight="600">domain 与 window：同一个位置的两套坐标</text>
<text x="185" y="138" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">输入 x：domain</text>
<line x1="365" y1="132" x2="890" y2="132" stroke="#3265D6" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="380" cy="132" r="5" fill="#3265D6" stroke="#3265D6" stroke-width="2"/>
<text x="380" y="115" text-anchor="middle" font-size="20" fill="#3265D6" font-weight="400">10</text>
<circle cx="620" cy="132" r="5" fill="#3265D6" stroke="#3265D6" stroke-width="2"/>
<text x="620" y="115" text-anchor="middle" font-size="20" fill="#3265D6" font-weight="400">11.5</text>
<circle cx="860" cy="132" r="5" fill="#3265D6" stroke="#3265D6" stroke-width="2"/>
<text x="860" y="115" text-anchor="middle" font-size="20" fill="#3265D6" font-weight="400">13</text>
<text x="185" y="273" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">内部 t：window</text>
<line x1="365" y1="267" x2="890" y2="267" stroke="#4A9479" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="380" cy="267" r="5" fill="#4A9479" stroke="#4A9479" stroke-width="2"/>
<text x="380" y="250" text-anchor="middle" font-size="20" fill="#4A9479" font-weight="400">-1</text>
<circle cx="620" cy="267" r="5" fill="#4A9479" stroke="#4A9479" stroke-width="2"/>
<text x="620" y="250" text-anchor="middle" font-size="20" fill="#4A9479" font-weight="400">0</text>
<circle cx="860" cy="267" r="5" fill="#4A9479" stroke="#4A9479" stroke-width="2"/>
<text x="860" y="250" text-anchor="middle" font-size="20" fill="#4A9479" font-weight="400">1</text>
<line x1="380" y1="149" x2="380" y2="220" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="620" y1="149" x2="620" y2="220" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="860" y1="149" x2="860" y2="220" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="480" y="184" width="280" height="30" fill="white"/>
<text x="620" y="207" text-anchor="middle" font-size="20" fill="#20365F" font-weight="400">t = (x − 11.5) / 1.5</text>
<text x="500" y="333" text-anchor="middle" font-size="23" fill="#20365F" font-weight="400">24 + 3t = 24 + 3(x − 11.5)/1.5 = 1 + 2x</text>
<text x="500" y="373" text-anchor="middle" font-size="18" fill="#536B8D" font-weight="400">系数改变是坐标表达改变；fitted(x) 与 convert() 后的求值仍一致。</text>
</g>
</svg>
