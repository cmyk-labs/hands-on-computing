<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">相邻样本的连线：面积与插值是两种读取方式</title>
<desc id="desc">采样点零零、一一、三九；左图两段梯形面积为零点五和十，右图在二处线性插值得五而平方函数为四。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#536B8D"/></marker></defs>
<rect width="1000" height="440" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#20365F">
<text x="500.0" y="38" text-anchor="middle" font-size="26" fill="#20365F" font-weight="600">相邻样本的连线：面积与插值是两种读取方式</text>
<text x="245" y="88" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">trapezoid：累积折线下方的面积</text>
<line x1="105" y1="350" x2="445.0" y2="350" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
