<text x="205" y="374" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">1</text>
<text x="305" y="374" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">2</text>
<text x="405" y="374" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">3</text>
<text x="91" y="259" text-anchor="end" font-size="16" fill="#20365F" font-weight="400">4</text>
<text x="91" y="139" text-anchor="end" font-size="16" fill="#20365F" font-weight="400">9</text>
<text x="455" y="351" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">x</text>
<text x="81" y="119" text-anchor="middle" font-size="18" fill="#20365F" font-weight="400">y</text>
<path d="M105 350 L205 326 L205 350 Z" fill="#ECF3FF" stroke="#3265D6" stroke-width="1"/>
<path d="M205 350 L205 326 L405 134 L405 350 Z" fill="#EFF8F4" stroke="#4A9479" stroke-width="1"/>
<text x="167" y="325" text-anchor="middle" font-size="16" fill="#20365F" font-weight="400">0.5</text>
<text x="340" y="302" text-anchor="middle" font-size="21" fill="#4A9479" font-weight="400">10</text>
<path d="M105 350 L205 326 L405 134" fill="none" stroke="#3265D6" stroke-width="3"/>
<circle cx="105" cy="350" r="5" fill="#3265D6" stroke="#3265D6" stroke-width="2"/>
<circle cx="205" cy="326" r="5" fill="#3265D6" stroke="#3265D6" stroke-width="2"/>
<circle cx="405" cy="134" r="5" fill="#3265D6" stroke="#3265D6" stroke-width="2"/>
<text x="733" y="88" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">interp：读取折线在新坐标处的高度</text>
<line x1="593" y1="350" x2="933.0" y2="350" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="593" y1="350" x2="593" y2="110" stroke="#536B8D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="593" y="374" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">0</text>
<text x="693" y="374" text-anchor="middle" font-size="17" fill="#20365F" font-weight="400">1</text>
