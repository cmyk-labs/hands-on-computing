<text x="836" y="283" text-anchor="middle" font-size="17" fill="#8B78C7" font-weight="400">(2, 4)：x²</text>
<path d="M593 350 L693 326 L893 134" fill="none" stroke="#3265D6" stroke-width="3"/>
<circle cx="593" cy="350" r="5" fill="#3265D6" stroke="#3265D6" stroke-width="2"/>
<circle cx="693" cy="326" r="5" fill="#3265D6" stroke="#3265D6" stroke-width="2"/>
<circle cx="893" cy="134" r="5" fill="#3265D6" stroke="#3265D6" stroke-width="2"/>
<text x="500" y="419" text-anchor="middle" font-size="19" fill="#20365F" font-weight="400">同一组点连成分段直线；既不假定等距，也不自动恢复原曲线。</text>
