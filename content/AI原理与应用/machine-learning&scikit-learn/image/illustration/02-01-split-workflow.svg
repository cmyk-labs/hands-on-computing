<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">训练、验证与最终测试的边界</title>
  <desc id="desc">先把数据划为训练、验证和保留测试三部分。训练数据用于拟合，验证数据用于比较设置。只在开发阶段依据验证结果调整，方案固定后才用保留测试数据进行最终评估。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5679AD"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #20365F; text-anchor: middle; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .body { font-size: 19px; }
      .note { font-size: 17px; fill: #506988; }
      .box { stroke-width: 2; rx: 18; }
      .link { fill: none; stroke: #5679AD; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="680" fill="white"/>
  <text x="560" y="49" class="heading">先划分数据，再学习与比较</text>
  <rect x="395" y="85" width="330" height="70" class="box" fill="#3265D6" stroke="#3265D6"/>
  <text x="560" y="128" class="label" style="fill:white">原始样本 X、目标 y</text>
  <path d="M560 155 V193 H205 V237" class="link"/>
  <path d="M560 155 V237" class="link"/>
  <path d="M560 193 H915 V237" class="link"/>
  <text x="738" y="223" class="note">按样本关系确定划分方式</text>

  <rect x="60" y="245" width="290" height="90" class="box" fill="#ECF3FF" stroke="#85A7E4"/>
  <text x="205" y="283" class="label">训练部分</text>
  <text x="205" y="313" class="body">学习模型与预处理参数</text>
  <rect x="415" y="245" width="290" height="90" class="box" fill="#EFF8F4" stroke="#83BFA9"/>
  <text x="560" y="283" class="label">验证部分</text>
  <text x="560" y="313" class="body">比较候选设置</text>
  <rect x="770" y="245" width="290" height="90" class="box" fill="#F3F0FF" stroke="#AB9BDD"/>
  <text x="915" y="283" class="label">保留测试部分</text>
  <text x="915" y="313" class="body">开发期间不查看评估结果</text>

  <path d="M205 335 V407" class="link"/>
  <path d="M560 335 V407" class="link"/>
  <path d="M915 335 V407" class="link"/>
  <text x="980" y="378" class="note">只用于终评</text>
  <rect x="60" y="415" width="290" height="110" class="box" fill="#ECF3FF" stroke="#85A7E4"/>
  <text x="205" y="455" class="label">拟合候选模型</text>
  <text x="205" y="490" class="body">fit 只接触训练数据</text>
  <rect x="415" y="415" width="290" height="110" class="box" fill="#EFF8F4" stroke="#83BFA9"/>
  <text x="560" y="455" class="label">预测并比较</text>
  <text x="560" y="490" class="body">依据验证指标选择</text>
  <rect x="770" y="415" width="290" height="110" class="box" fill="#F3F0FF" stroke="#AB9BDD"/>
  <text x="915" y="455" class="label">最终评估</text>
  <text x="915" y="490" class="body">报告所选模型的结果</text>
  <path d="M350 470 H407" class="link"/>
  <path d="M705 470 H762" class="link"/>
  <text x="737" y="391" class="note">方案固定后</text>
  <path d="M560 525 V592 H205 V533" class="link" stroke-dasharray="7 5"/>
  <text x="382" y="621" class="note">虚线：仅在开发阶段调整设置并重新拟合</text>
  <text x="560" y="656" class="note">原创三划分示意；最终测试结果不用于反复选模型，本图省略可选的开发集重新拟合。</text>
</svg>
