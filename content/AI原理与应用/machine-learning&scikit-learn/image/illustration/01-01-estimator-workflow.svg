<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc">
  <title id="title">监督学习中 fit 与 predict 的职责</title>
  <desc id="desc">训练特征和目标经过 fit 得到拟合后的模型。预测时，将测试特征交给该模型的 predict 方法得到预测值；测试目标不参与拟合，只用于之后的评估。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5679AD"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #20365F; text-anchor: middle; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 700; }
      .body { font-size: 19px; }
      .note { font-size: 17px; fill: #506988; }
      .box { stroke-width: 2; rx: 18; }
      .link { fill: none; stroke: #5679AD; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="590" fill="white"/>
  <text x="560" y="50" class="heading">从训练样本到新样本预测</text>
  <text x="560" y="88" class="body">fit 学习状态，predict 使用已经学到的状态</text>

  <rect x="45" y="150" width="270" height="120" class="box" fill="#ECF3FF" stroke="#85A7E4"/>
  <text x="180" y="188" class="label">训练数据</text>
  <text x="180" y="221" class="body">X_tr：特征矩阵</text>
  <text x="180" y="249" class="body">y_tr：对应的目标</text>

  <rect x="410" y="150" width="300" height="120" class="box" fill="#3265D6" stroke="#3265D6"/>
  <text x="560" y="190" class="label" style="fill:white">拟合 fit</text>
  <text x="560" y="228" class="body" style="fill:white">model.fit(X_tr, y_tr)</text>
  <path d="M315 210 H402" class="link"/>

  <rect x="805" y="150" width="270" height="120" class="box" fill="#EFF8F4" stroke="#83BFA9"/>
  <text x="940" y="189" class="label">拟合后的模型</text>
  <text x="940" y="223" class="body">保留从训练数据</text>
  <text x="940" y="249" class="body">学到的状态</text>
  <path d="M710 210 H797" class="link"/>

  <rect x="45" y="365" width="270" height="110" class="box" fill="#F3F0FF" stroke="#AB9BDD"/>
  <text x="180" y="405" class="label">待预测的特征</text>
  <text x="180" y="441" class="body">X_te</text>

  <rect x="410" y="365" width="300" height="110" class="box" fill="#ECF3FF" stroke="#85A7E4"/>
  <text x="560" y="405" class="label">预测 predict</text>
  <text x="560" y="441" class="body">model.predict(X_te)</text>
  <path d="M315 420 H402" class="link"/>
  <path d="M940 270 V309 H560 V357" class="link"/>
  <text x="750" y="340" class="note">使用同一个拟合后的模型</text>

  <rect x="805" y="365" width="270" height="110" class="box" fill="#EFF8F4" stroke="#83BFA9"/>
  <text x="940" y="405" class="label">预测结果</text>
  <text x="940" y="441" class="body">每个输入样本一个预测</text>
  <path d="M710 420 H797" class="link"/>

  <text x="560" y="528" class="body">y_te 仅留给评估，不传入 fit 或 predict。</text>
  <text x="560" y="560" class="note">原创接口示意；以单目标监督学习为例，省略模型内部求解与评估细节。</text>
</svg>
