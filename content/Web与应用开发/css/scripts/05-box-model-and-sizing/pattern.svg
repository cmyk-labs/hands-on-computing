<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150" preserveAspectRatio="none">
<!-- 允许图形随 SVG 视口拉伸，以观察 object-fit: fill 与 contain 的区别。 -->
<rect width="300" height="150" fill="white"/>
<circle cx="60" cy="75" r="45" fill="orange"/>
<rect x="180" y="30" width="90" height="90" fill="teal"/>
<path d="M150 0V150" stroke="gray" stroke-width="2"/>
</svg>
