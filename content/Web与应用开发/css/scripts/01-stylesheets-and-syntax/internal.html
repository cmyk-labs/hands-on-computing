<!doctype html>
<!-- 所属章节：01-样式表与基本语法
     演示知识点：内部样式表：写在 style 元素中的规则
     运行命令：python -m http.server 8101 --bind 127.0.0.1；浏览器打开 http://127.0.0.1:8101/scripts/01-stylesheets-and-syntax/internal.html（工作目录 content/Web与应用开发/css）
     期望结果：段落颜色与字号和外部样式表示例相同 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内部样式表</title>
  <style>
    /* 与外部样式表示例比较：段落的颜色和字号相同。 */
    p {
      color: navy;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <h1>周末阅读</h1>
  <p>每天留出一点时间读书。</p>
  <nav aria-label="样式表示例"><a href="index.html">返回外部样式表示例</a></nav>
</body>
</html>
