<!doctype html>
<!-- 所属章节：01-样式表与基本语法
     演示知识点：内联样式：写在 style 属性中的声明
     运行命令：python -m http.server 8101 --bind 127.0.0.1；浏览器打开 http://127.0.0.1:8101/scripts/01-stylesheets-and-syntax/inline.html（工作目录 content/Web与应用开发/css）
     期望结果：段落仍为深蓝色、字号 20px -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内联样式</title>
</head>
<body>
  <h1>周末阅读</h1>
  <p style="color: navy; font-size: 20px;">每天留出一点时间读书。</p>
  <!-- 与另两种引入方式比较：这个段落仍为深蓝色，字号为 20px。 -->
  <nav aria-label="样式表示例"><a href="index.html">返回外部样式表示例</a></nav>
</body>
</html>
