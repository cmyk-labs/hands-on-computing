<!doctype html>
<!-- 所属章节：17-变换与过渡
     演示知识点：transition 多属性分时过渡、悬停与聚焦状态、缓动函数对比、中途移开时的反向中断
     运行命令：python -m http.server 8101 --bind 127.0.0.1（工作目录 content/Web与应用开发/css）；浏览器打开 http://127.0.0.1:8101/scripts/17-transforms-and-transitions/transitions.html
     期望结果：悬停或聚焦后按钮 800ms 位移且延迟 100ms，中途移开从当前值反向；三个圆点终点相同但节奏分别为匀速、曲线与四步 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>状态变化与过渡</title>
  <link rel="stylesheet" href="transitions.css">
</head>
<body>
<main>
<h1>状态变化与过渡</h1>
<p><a href="index.html">返回首页</a></p><section><button class="action" type="button">悬停或 Tab 聚焦</button>
<p>移开指针并移走焦点，可观察回程。</p></section><section><input id="move" type="checkbox"><label for="move">比较缓动</label>
<div class="lane"><div class="dot linear">匀速</div></div>
<div class="lane"><div class="dot bezier">曲线</div></div>
<div class="lane"><div class="dot stepped">四步</div></div></section>
</main>
</body>
</html>
