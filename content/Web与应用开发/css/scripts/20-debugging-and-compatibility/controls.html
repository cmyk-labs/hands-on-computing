<!doctype html>
<!-- 所属章节：20-调试与兼容处理
     演示知识点：-webkit- 前缀与标准 appearance 并写、原生 disabled 状态、长文本换行及窄视口、缩放、Tab 的多状态检查
     运行命令：python -m http.server 8101 --bind 127.0.0.1（工作目录 content/Web与应用开发/css）；浏览器打开 http://127.0.0.1:8101/scripts/20-debugging-and-compatibility/controls.html
     期望结果：按钮去除默认外观且禁用按钮置灰，长标识不撑宽页面，焦点轮廓不被裁切 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>控件、前缀与多状态检查</title>
  <link rel="stylesheet" href="controls.css">
</head>
<body>
<main>
<h1>控件、前缀与多状态检查</h1>
<p><a href="index.html">返回首页</a></p><button class="styled-button" type="button">可聚焦按钮</button>
<button class="styled-button" type="button" disabled>禁用按钮</button>
<label for="email">邮箱</label><input id="email" type="email">
<p class="long-text">较长标识：hands-on-computing-css-compatibility-long-content-example</p>
</main>
</body>
</html>
