<!doctype html>
<!-- 所属章节：11-Flexbox 布局
     演示知识点：主轴方向与容器显示、换行与间隙、项目与行组对齐
     运行命令：python -m http.server 8101 --bind 127.0.0.1；浏览器打开 http://127.0.0.1:8101/scripts/11-flexbox/index.html（工作目录 content/Web与应用开发/css）
     期望结果：row/column/reverse 排列方向不同，对齐与行组分布按注释呈现 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flexbox 布局：轴与对齐</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Flexbox 布局：轴与对齐</h1>
<nav><a href="sizing.html">空间分配</a> · <a href="patterns.html">常见模式</a></nav>
<section>
<h2>主轴与容器显示</h2>
<div class="axis row-axis"><span>A</span><span>B</span><span>C</span></div>
<div class="axis column-axis"><span>A</span><span>B</span><span>C</span></div>
<div class="axis reverse-axis"><span>A</span><span>B</span><span>C</span></div>
<p>行内文字 <span class="inline-axis"><span>A</span><span>B</span></span> 后续文字</p>
</section>
<section>
<h2>换行与间隙</h2>
<div class="wrap-demo"><span>A</span><span>B</span><span>C</span></div>
<div class="wrap-demo no-wrap"><span>A</span><span>B</span><span>C</span></div>
</section>
<section>
<h2>项目与行组对齐</h2>
<div class="aligned-row"><span>甲</span><span class="self-end">乙</span><span>丙</span></div>
<div class="packed"><span>A</span><span>B</span><span>C</span><span>D</span></div>
</section>

</body>
</html>
