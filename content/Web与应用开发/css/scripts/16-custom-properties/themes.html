<!doctype html>
<!-- 所属章节：16-自定义属性与主题
     演示知识点：data-theme="auto" 配合 prefers-color-scheme 切换一组主题令牌，color-scheme: light dark 跟随系统
     运行命令：python -m http.server 8101 --bind 127.0.0.1（工作目录 content/Web与应用开发/css）；浏览器打开 http://127.0.0.1:8101/scripts/16-custom-properties/themes.html
     期望结果：仿真系统 dark 时作者表面、文字、链接与边框值和默认控件配色一起切换到暗色 -->
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自定义属性与主题 · 跟随系统主题</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>自定义属性与主题</h1>
<nav aria-label="本章示例"><a href="index.html">复用、继承与作用范围</a> · <a href="invalid.html">回退与计算值无效</a> · <a href="registered.html">注册属性与未注册对照</a> · <a href="themes.html">跟随系统主题</a> · <a href="light.html">固定浅色主题</a> · <a href="dark.html">固定暗色主题</a></nav>
<main>
<section>
<h2>主题值与系统明暗偏好</h2>
<article class="theme-panel">
  <h3>阅读主题</h3>
  <p>同一组件读取表面、文字、链接和边框值。</p>
  <a class="theme-link" href="#theme-end">阅读下一段</a>
  <p><label>笔记标题 <input class="theme-input" value="布局学习"></label></p>
</article>
<p id="theme-end">下一段内容。</p>
</section>

<section>
<h2>显式选择主题并设置 color-scheme</h2>
<p class="theme-choices">
  <a href="themes.html">跟随系统</a>
  <a href="light.html">固定浅色</a>
  <a href="dark.html">固定暗色</a>
</p>
</section>
</main>
</body>
</html>
