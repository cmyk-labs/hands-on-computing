<!doctype html>
<!-- 所属章节：19-样式组织与作用域
     演示知识点：后层普通声明胜过前层 ID 选择器、层外普通声明胜过层内声明、!important 反转重要声明的层顺序
     运行命令：python -m http.server 8101 --bind 127.0.0.1（工作目录 content/Web与应用开发/css）；浏览器打开 http://127.0.0.1:8101/scripts/19-organization-and-scope/layers.html
     期望结果：三行文字颜色依次为 teal、navy、maroon -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>显式控制覆盖顺序</title>
  <link rel="stylesheet" href="layers.css">
</head>
<body>
<main>
<h1>显式控制覆盖顺序</h1>
<p><a href="index.html">返回首页</a></p><p id="layered" class="layer-note">后层普通声明</p>
<p class="unlayered-note">层外普通声明</p>
<p class="important-note">重要声明层次反转</p>
</main>
</body>
</html>
