<!doctype html>
<!-- 所属章节：19-样式组织与作用域
     演示知识点：按基础、组件、页面三种职责组织样式，styles.css 声明层次并分层导入
     运行命令：python -m http.server 8101 --bind 127.0.0.1（工作目录 content/Web与应用开发/css）；浏览器打开 http://127.0.0.1:8101/scripts/19-organization-and-scope/index.html
     期望结果：精选卡片加粗边框且不依赖外层标签，页面宽度受限；列表标记与控件字体保持基础层样式 -->
<html lang="zh-CN">

<body>
<main>
<h1>样式组织与作用域</h1>
<nav><a href="layers.html">层顺序</a> · <a href="nesting.html">原生嵌套</a> · <a href="scope.html">作用域</a></nav>
<div class="notes-page"><article class="note-card note-card--featured">
  <h2 class="note-card__title">组件边界</h2>

  <button class="note-card__button" type="button" disabled>暂不可用</button>

<ul><li>普通正文列表保留标记。</li></ul>
