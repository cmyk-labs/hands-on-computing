<!doctype html>
<!-- 所属章节：12-Grid 布局
     演示知识点：项目对齐、轨道整体对齐与同一格内重叠
     运行命令：python -m http.server 8101 --bind 127.0.0.1；浏览器打开 http://127.0.0.1:8101/scripts/12-grid/alignment.html（工作目录 content/Web与应用开发/css）
     期望结果：轨道组居中而 B 靠自身格右下角，重叠的前后两层同时可见 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid 布局 · 对齐与重叠</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Grid 布局</h1>
<nav aria-label="本章示例"><a href="index.html">轨道、尺寸与页面区域</a> · <a href="placement.html">自动放置与隐式轨道</a> · <a href="alignment.html">对齐与重叠</a> · <a href="subgrid.html">子网格与独立网格回退</a></nav>
<main>
<section>
<h2>项目对齐与轨道整体对齐</h2>
<div class="alignment-grid">
  <div>A</div><div class="own-alignment">B</div>
</div>
</section>

<section>
<h2>在同一格内重叠</h2>
<div class="overlap-grid">
  <div class="back-layer">背景区域</div>
  <p class="front-layer">同一格内的说明</p>
</div>
</section>
</main>
</body>
</html>
