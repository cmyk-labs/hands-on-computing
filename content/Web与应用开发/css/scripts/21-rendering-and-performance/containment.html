<!doctype html>
<!-- 所属章节：21-渲染与性能
     演示知识点：contain: paint 裁剪后代溢出、contain: size 的自动尺寸不由后代撑开及显式预留对照
     运行命令：python -m http.server 8101 --bind 127.0.0.1（工作目录 content/Web与应用开发/css）；浏览器打开 http://127.0.0.1:8101/scripts/21-rendering-and-performance/containment.html
     期望结果：绘制隔离组溢出被裁剪；尺寸隔离盒高度不由 80px 子内容撑开，显式 min-height 组预留 90px -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>隔离带来的语义边界</title>
  <link rel="stylesheet" href="containment.css">
</head>
<body>
<main>
<h1>隔离带来的语义边界</h1>
<p><a href="index.html">返回首页</a></p><div class="paint-box"><div class="overflow-piece">未隔离的溢出</div></div>
<div class="paint-box clipped"><div class="overflow-piece">绘制隔离后的溢出</div></div>
<div class="size-shell"><div class="size-box"><div class="sized-content">子内容高80px</div></div></div>
<div class="size-shell"><div class="size-box explicit"><div class="sized-content">额外预留90px</div></div></div>
</main>
</body>
</html>
