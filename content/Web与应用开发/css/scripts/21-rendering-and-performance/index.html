<!doctype html>
<!-- 所属章节：21-渲染与性能
     演示知识点：left 与 transform 两种位移模式的渲染对照、opacity 变化保留布局占位、will-change 可选提示
     运行命令：python -m http.server 8101 --bind 127.0.0.1（工作目录 content/Web与应用开发/css）；浏览器打开 http://127.0.0.1:8101/scripts/21-rendering-and-performance/index.html
     期望结果：十六个样本在两种模式下均在 2s 内移动 160px，每次只播放一种；勾选播放后供性能面板录制比较 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>渲染与性能</title>

<input id="left-mode" name="mode" type="radio" checked><label for="left-mode">left 位移</label>
<input id="transform-mode" name="mode" type="radio"><label for="transform-mode">transform 位移</label>
<input id="run" type="checkbox"><label for="run">播放</label>
<input id="hint" type="checkbox"><label for="hint">仅第一项启用 will-change</label>
<div class="samples" aria-label="十六个装饰性位移样本"><div class="row"><div class="mover"></div></div>

</main>

</html>
