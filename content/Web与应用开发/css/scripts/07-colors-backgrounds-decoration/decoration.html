<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>颜色、背景与装饰：背景</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>颜色、背景与装饰：背景</h1>
<nav><a href="index.html">颜色示例</a></nav>
<section>
<h2>图像尺寸与边界</h2>
<div class="picture cover">cover</div>
<div class="picture contain">contain</div>
</section>
<section>
<h2>多重背景</h2>
<div class="layers">文字始终是 HTML 内容</div>
</section>
<section>
<h2>渐变</h2>
<div class="gradient linear">线性渐变</div>
<div class="gradient radial">径向渐变</div>
<div class="gradient stripes">重复渐变</div>
<div class="gradient conic">锥形渐变</div>
</section>
<section>
<h2>边框、圆角与阴影</h2>
<p class="bordered">边框占据盒模型空间</p>
<p class="rounded">椭圆圆角</p>
<p class="shadowed">阴影不挤开相邻元素</p>
</section>

</body>
</html>
