<!doctype html>
<!-- 所属章节：07-颜色、背景与装饰
     演示知识点：RGB/HSL 写法、透明度与 currentColor、现代颜色增强与回退、状态提示色
     运行命令：python -m http.server 8101 --bind 127.0.0.1；浏览器打开 http://127.0.0.1:8101/scripts/07-colors-backgrounds-decoration/index.html（工作目录 content/Web与应用开发/css）
     期望结果：三种写法呈同一颜色，不支持的新语法保留基础回退色 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>颜色、背景与装饰：颜色</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>颜色、背景与装饰：颜色</h1>
<nav><a href="decoration.html">背景与装饰示例</a></nav>
<section>
<h2>RGB 与 HSL</h2>
<p class="hex">十六进制颜色</p>
<p class="rgb">RGB 颜色</p>
<p class="hsl">HSL 颜色</p>
</section>
<section>
<h2>透明度与当前颜色</h2>
<div class="alpha-area">
  <p class="alpha-only"><strong>只让背景半透明</strong></p>
  <p class="whole-opacity"><strong>让整段半透明</strong></p>
</div>
<p class="current-color">文字与边框使用同一个前景色</p>
</section>
<section>
<h2>现代颜色与回退</h2>
<p class="modern">Oklch 增强色</p>
<p class="wide">Display P3 增强色</p>
<p class="mixed">与白色混合</p>
<p class="fallback">始终显示基础回退色</p>
</section>
<section>
<h2>可读状态提示</h2>
<p class="status"><strong>已保存：</strong>笔记保存在本地。</p>
<p class="status warning"><strong>待检查：</strong>请补充标题。</p>
</section>

</body>
</html>
