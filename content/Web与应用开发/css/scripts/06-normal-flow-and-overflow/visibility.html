<!doctype html>
<!-- 所属章节：06-正常流与溢出
     演示知识点：display:none、visibility:hidden 与 opacity:0 的布局焦点差异，及 contents 与 hidden 属性对照
     运行命令：python -m http.server 8101 --bind 127.0.0.1；浏览器打开 http://127.0.0.1:8101/scripts/06-normal-flow-and-overflow/visibility.html（工作目录 content/Web与应用开发/css）
     期望结果：三种隐藏方式占位与 Tab 可达性不同，contents 父盒不绘制而子内容仍继承 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正常流与溢出</title>
<link rel="stylesheet" href="visibility.css">
</head>
<body>
<h1>正常流与溢出</h1>
<nav aria-label="本章页面"><a href="index.html">index.html</a> · <a href="overflow.html">overflow.html</a> · <a href="visibility.html">visibility.html</a></nav>
<section id="demo-8">
<h2>三种隐藏方式的布局与焦点差异</h2>
<button id="hide-start" type="button">从这里开始按 Tab</button>
<button class="hide-item hide-none" type="button">display none</button>
<button class="hide-item hide-visibility" type="button">visibility hidden</button>
<button class="hide-item hide-opacity" type="button">透明按钮，聚焦后显示</button>
<button id="hide-end" type="button">结束</button>
</section>

<section id="demo-9">
<h2>contents 与 HTML hidden 要分清</h2>
<div class="contents-box">
  <p class="contents-child">父盒消失，子内容仍在</p>
</div>
<p class="ordinary-hidden" hidden>当前不呈现的内容</p>
</section>
</body>
</html>
