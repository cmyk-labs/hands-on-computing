<!doctype html>
<!-- 所属章节：25-锚点定位
     演示知识点：popover 属性与 popovertarget 触发、锚定浮层的 position-try-fallbacks 多级位置回退、@position-try 自定义候选
     运行命令：python -m http.server 8101 --bind 127.0.0.1（工作目录 content/Web与应用开发/css）；浏览器打开 http://127.0.0.1:8101/scripts/25-anchor-positioning/popover.html
     期望结果：面板默认在按钮下方左对齐，靠近右下边缘时翻转方向，都放不下时落入视口左上角；关闭按钮或 Escape 退出 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浮层与位置回退</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>浮层与位置回退</h1><nav><a href="index.html">返回基础示例</a></nav><main><p>按钮位于有裁剪边界的区域中。使用按钮打开说明，再缩小窗口或滚动页面。</p><div class="edge-zone">
  <button id="help-trigger" type="button" popovertarget="help-panel">打开填写说明</button>
  <section id="help-panel" popover="auto" aria-labelledby="help-title">
    <h2 id="help-title">填写说明</h2>
    <p>标题应简短明确，详细说明放在正文。本面板可用关闭按钮或 Escape 退出。</p>
    <p>调整窗口，观察面板在边缘附近选择不同位置。</p>
    <button class="close" type="button" popovertarget="help-panel" popovertargetaction="hide">关闭说明</button>
  </section>
</div><p class="after">这里留出滚动空间，用来观察锚点移动。</p></main>
</body>
</html>
