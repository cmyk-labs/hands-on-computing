<!doctype html>
<!-- 所属章节：18-关键帧动画
     演示知识点：:checked 状态触发一次性动画、width 动画与 scaleX 动画对布局影响的对照、prefers-reduced-motion 下保留状态样式
     运行命令：python -m http.server 8101 --bind 127.0.0.1（工作目录 content/Web与应用开发/css）；浏览器打开 http://127.0.0.1:8101/scripts/18-keyframe-animations/state.html
     期望结果：两盒暂停在中点时宽度动画推开邻居而缩放动画保留占位；勾选完成触发一次上浮提示，减少运动时动画关闭但配色状态保留 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>状态、布局与减少运动</title>
  <link rel="stylesheet" href="state.css">
</head>
<body>
<main>
<h1>状态、布局与减少运动</h1>
<p><a href="index.html">返回首页</a></p><input id="done" type="checkbox"><label for="done">标记已完成</label>
<p class="status">完成状态由复选框决定。</p>
<div class="row"><div class="layout-box by-width"></div><span>宽度动画的邻居</span></div>
<div class="row"><div class="layout-box by-scale"></div><span>缩放动画的邻居</span></div>
</main>
</body>
</html>
