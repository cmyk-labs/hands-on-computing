<!doctype html>
<!-- 所属章节：18-关键帧动画
     演示知识点：animation-direction 四种方向播放两轮的对照，animation-fill-mode 四种填充在 1s 延迟期内与播放结束后的表现
     运行命令：python -m http.server 8101 --bind 127.0.0.1（工作目录 content/Web与应用开发/css）；浏览器打开 http://127.0.0.1:8101/scripts/18-keyframe-animations/playback.html
     期望结果：alternate 两轮为去一次回一次；延迟期内 backwards/both 呈首帧，结束后 forwards/both 保持末帧 140px，none 回到基础偏移 20px -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>播放方向与填充</title>
  <link rel="stylesheet" href="playback.css">
</head>
<body>
<main>
<h1>播放方向与填充</h1>
<p><a href="index.html">返回首页</a></p><section><input id="directions" type="checkbox"><label for="directions">播放两轮</label>
<div class="directions">
  <div class="lane"><div class="runner normal">normal</div></div>
  <div class="lane"><div class="runner reverse">reverse</div></div>
  <div class="lane"><div class="runner alternate">alternate</div></div>
  <div class="lane"><div class="runner alternate-reverse">alternate-reverse</div></div>
</div></section><section><input id="fill" type="checkbox"><label for="fill">播放填充对照</label>
<div class="fills">
  <div class="lane"><div class="sample fill-none">none</div></div>
  <div class="lane"><div class="sample fill-forwards">forwards</div></div>
  <div class="lane"><div class="sample fill-backwards">backwards</div></div>
  <div class="lane"><div class="sample fill-both">both</div></div>
</div></section>
</main>
</body>
</html>
