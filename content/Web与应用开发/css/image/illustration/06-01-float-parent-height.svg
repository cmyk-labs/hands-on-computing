<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-labelledby="title desc">
<title id="title">float 子盒相同，父盒的自动高度计算不同</title><desc id="desc">普通父块仅浮动子项时内容高零；flow-root 包含浮动高度60，含边框外沿分别2和62。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526787"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#20365F;font-size:22px} .small{font-size:18px;fill:#526787}.label{font-size:23px;font-weight:600}</style>
<rect width="1040" height="400" fill="white"/>
<text x="32" y="46" text-anchor="start" style="font-size:30px;font-weight:700;fill:#20365F">float 子盒相同，父盒的自动高度计算不同</text>
<text x="70" y="110" text-anchor="start" style="font-size:25px;font-weight:600;fill:#20365F">普通块</text>
<rect x="70" y="175" width="400" height="4" rx="0" fill="#EFF8F4" stroke="#8BADED" stroke-width="2"/>
<rect x="72" y="177" width="132" height="120" rx="0" fill="#ECF3FF" stroke="#8BADED" stroke-width="2"/>
<text x="136" y="244" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">float</text>
<text x="240" y="210" text-anchor="start" style="font-size:22px;font-weight:400;fill:#20365F">父盒外沿：2px</text>
<text x="570" y="110" text-anchor="start" style="font-size:25px;font-weight:600;fill:#20365F">flow-root</text>
<rect x="570" y="175" width="400" height="124" rx="0" fill="#EFF8F4" stroke="#8BADED" stroke-width="2"/>
<rect x="572" y="177" width="132" height="120" rx="0" fill="#ECF3FF" stroke="#8BADED" stroke-width="2"/>
<text x="636" y="244" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">float</text>
<text x="740" y="210" text-anchor="start" style="font-size:22px;font-weight:400;fill:#20365F">父盒外沿：62px</text>
<text x="32" y="376" text-anchor="start" style="font-size:18px;font-weight:400;fill:#526787">对应仅有一个 60px 高浮动子盒、无 padding 且边框 1px 的示例；图形尺寸经过缩放。</text>
</svg>
