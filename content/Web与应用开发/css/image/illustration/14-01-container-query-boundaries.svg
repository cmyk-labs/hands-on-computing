<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
<title id="title">视口相同，卡片仍可因祖先容器不同而变化</title><desc id="desc">宽容器700像素满足480像素查询，窄容器280像素不满足，子卡片分别采用双列与单列。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526787"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#20365F;font-size:22px} .small{font-size:18px;fill:#526787}.label{font-size:23px;font-weight:600}</style>
<rect width="1040" height="450" fill="white"/>
<text x="32" y="46" text-anchor="start" style="font-size:30px;font-weight:700;fill:#20365F">视口相同，卡片仍可因祖先容器不同而变化</text>
<rect x="30" y="95" width="980" height="280" rx="12" fill="white" stroke="#8BADED" stroke-width="2"/>
<text x="50" y="130" text-anchor="start" style="font-size:23px;font-weight:600;fill:#20365F">同一个浏览器视口</text>
<rect x="58" y="155" width="595" height="186" rx="12" fill="#EFF8F4" stroke="#8BADED" stroke-width="2"/>
<rect x="685" y="155" width="295" height="186" rx="12" fill="#F3F0FF" stroke="#8BADED" stroke-width="2"/>
<text x="78" y="186" text-anchor="start" style="font-size:21px;font-weight:400;fill:#20365F">card-space：700px ≥ 480px</text>
<text x="702" y="186" text-anchor="start" style="font-size:21px;font-weight:400;fill:#20365F">280px &lt; 480px</text>
<rect x="80" y="213" width="135" height="97" rx="12" fill="#ECF3FF" stroke="#8BADED" stroke-width="2"/>
<text x="147.5" y="269.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">封面</text>
<rect x="235" y="213" width="396" height="97" rx="12" fill="white" stroke="#8BADED" stroke-width="2"/>
<text x="433.0" y="254.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">标题与正文</text>
<text x="433.0" y="284.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">双列卡片</text>
<rect x="707" y="207" width="250" height="48" rx="12" fill="#ECF3FF" stroke="#8BADED" stroke-width="2"/>
<text x="832.0" y="239.0" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">封面</text>
<rect x="707" y="270" width="250" height="52" rx="12" fill="white" stroke="#8BADED" stroke-width="2"/>
<text x="832.0" y="304.0" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">标题与正文</text>
<text x="32" y="426" text-anchor="start" style="font-size:18px;font-weight:400;fill:#526787">以空间足够的宽视口为例；查询祖先容器的内容盒，样式改变的是其中的卡片后代。</text>
</svg>
