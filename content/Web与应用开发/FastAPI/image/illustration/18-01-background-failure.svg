<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">响应已发送，后台任务才继续</title><desc id="desc">失败不会把已经发送的 202 改写成 500；接受请求与后台工作完成是两个时刻。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597AAA"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20365F">
<text x="40" y="42" font-size="27" text-anchor="start" font-weight="600" fill="#20365F">响应已发送，后台任务才继续</text>
<rect x="40.0" y="120" width="280.0" height="105" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="180.0" y="151" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">返回 202</text>
<text x="180.0" y="180" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">accepted 已发给客户端</text>
<rect x="360.0" y="120" width="280.0" height="105" rx="14" fill="#EFF8F4" stroke="#597AAA" stroke-width="1.7"/>
<text x="500.0" y="151" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">第一个任务</text>
<text x="500.0" y="180" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">fail_work 抛出异常</text>
<path d="M320.0,172 L357.0,172" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680.0" y="120" width="280.0" height="105" rx="14" fill="#F3F0FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="820.0" y="151" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">后续任务被跳过</text>
<text x="820.0" y="180" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">同一响应上的</text>
<text x="820.0" y="205" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">剩余任务不再执行</text>
<path d="M640.0,172 L677.0,172" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="315" font-size="17" text-anchor="start" font-weight="400" fill="#20365F">失败不会把已经发送的 202 改写成 500；接受请求与后台工作完成是两个时刻。</text>
</g></svg>
