<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="442" viewBox="0 0 1000 442" role="img" aria-labelledby="title desc">
<title id="title">真实 HTTP 请求经过监听端口</title><desc id="desc">TestClient 在应用内调用；本节 HTTPX 请求实际经过端口与 Uvicorn。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597AAA"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20365F">
<text x="40" y="42" font-size="27" text-anchor="start" font-weight="600" fill="#20365F">真实 HTTP 请求经过监听端口</text>
<rect x="25.0" y="75" width="210" height="52" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="130.0" y="106" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">HTTPX / 浏览器</text>
<path d="M130.0,130 L130.0,382" stroke="#A7BAD6" stroke-dasharray="5 5" stroke-width="1.5"/>
