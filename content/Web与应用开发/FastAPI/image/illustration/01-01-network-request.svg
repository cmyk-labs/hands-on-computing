<text x="500.0" y="106" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">Uvicorn</text>
<path d="M500.0,130 L500.0,382" stroke="#A7BAD6" stroke-dasharray="5 5" stroke-width="1.5"/>
<rect x="765.0" y="75" width="210" height="52" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="870.0" y="106" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">FastAPI 路由</text>
<path d="M870.0,130 L870.0,382" stroke="#A7BAD6" stroke-dasharray="5 5" stroke-width="1.5"/>
<path d="M130.0,173 L500.0,173" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="315.0" y="163.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">GET /hello?name=Lin → 127.0.0.1:8010</text>
<path d="M500.0,236 L870.0,236" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="685.0" y="226.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">通过 ASGI 调用应用</text>
<path d="M870.0,299 L500.0,299" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="685.0" y="289.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">生成响应状态与 JSON 数据</text>
<path d="M500.0,362 L130.0,362" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="315.0" y="352.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">HTTP 200 与响应体</text>
<text x="40" y="417" font-size="17" text-anchor="start" font-weight="400" fill="#20365F">TestClient 在应用内调用；本节 HTTPX 请求实际经过端口与 Uvicorn。</text>
