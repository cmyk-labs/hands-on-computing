<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="355" viewBox="0 0 1000 355" role="img" aria-labelledby="title desc">
<title id="title">接口文档是客户端生成的输入</title><desc id="desc">接口约定变化后重新生成并测试；文档声明本身不会实现业务分支。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597AAA"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20365F">
<text x="40" y="42" font-size="27" text-anchor="start" font-weight="600" fill="#20365F">接口文档是客户端生成的输入</text>
<rect x="40.0" y="120" width="200.0" height="105" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="140.0" y="151" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">服务声明</text>
<text x="140.0" y="180" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">路由 / 参数</text>
<text x="140.0" y="205" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">响应模型</text>
<rect x="280.0" y="120" width="200.0" height="105" rx="14" fill="#EFF8F4" stroke="#597AAA" stroke-width="1.7"/>
<text x="380.0" y="151" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">OpenAPI JSON</text>
<text x="380.0" y="180" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">路径与模式</text>
<text x="380.0" y="205" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">operationId</text>
<path d="M240.0,172 L277.0,172" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="520.0" y="120" width="200.0" height="105" rx="14" fill="#F3F0FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="620.0" y="151" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">生成 Python 包</text>
<text x="620.0" y="180" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">数据类</text>
<text x="620.0" y="205" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">调用函数</text>
<path d="M480.0,172 L517.0,172" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="760.0" y="120" width="200.0" height="105" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="860.0" y="151" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">调用并核对</text>
<text x="860.0" y="180" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">200 / 404</text>
<text x="860.0" y="205" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">状态与解析结果</text>
<path d="M720.0,172 L757.0,172" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="330" font-size="17" text-anchor="start" font-weight="400" fill="#20365F">接口约定变化后重新生成并测试；文档声明本身不会实现业务分支。</text>
</g></svg>
