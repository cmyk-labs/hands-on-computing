<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">应用资源覆盖多个请求的寿命</title><desc id="desc">应用共享客户端在lifespan中创建和关闭，请求依赖只负责借用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597AAA"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20365F">
<text x="40" y="42" font-size="27" text-anchor="start" font-weight="600" fill="#20365F">应用资源覆盖多个请求的寿命</text>
<rect x="40" y="90" width="920" height="265" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="65" y="130" font-size="21" text-anchor="start" font-weight="600" fill="#20365F">lifespan：创建共享 HTTP 客户端</text>
<rect x="95" y="175" width="365" height="110" rx="14" fill="#EFF8F4" stroke="#597AAA" stroke-width="1.7"/>
<text x="115" y="209" font-size="21" text-anchor="start" font-weight="600" fill="#20365F">请求 A</text>
<text x="115" y="240" font-size="16" text-anchor="start" font-weight="400" fill="#20365F">依赖进入 → 路由 → 响应 → 依赖退出</text>
<rect x="530" y="175" width="365" height="110" rx="14" fill="#EFF8F4" stroke="#597AAA" stroke-width="1.7"/>
<text x="550" y="209" font-size="21" text-anchor="start" font-weight="600" fill="#20365F">请求 B</text>
<text x="550" y="240" font-size="16" text-anchor="start" font-weight="400" fill="#20365F">依赖进入 → 路由 → 响应 → 依赖退出</text>
<text x="620" y="326" font-size="20" text-anchor="start" font-weight="600" fill="#20365F">停止应用：关闭共享客户端</text>
<text x="40" y="415" font-size="17" text-anchor="start" font-weight="400" fill="#20365F">示例使用默认 request 作用域；scope=&quot;function&quot; 的依赖在响应发送前退出。</text>
</g></svg>
