<!doctype html>
<!-- 所属章节：23-模板与静态资源
演示知识点：完整列表页模板：for 循环渲染记录链接，url_for 生成详情地址与 /static/style.css 样式地址
运行命令：python -m uvicorn app:app --app-dir scripts/23-templates-and-static-files --host 127.0.0.1 --port 8230，浏览器打开 http://127.0.0.1:8230/（工作目录 content/Web与应用开发/FastAPI）
期望结果：列表显示“模板上下文”和“自动转义实验”两条链接，点击进入对应详情页 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <main>
    <h1>{{ title }}</h1>
    <p>选择一条记录查看详情。</p>
    <ul>
      {% for record in records %}
      <li><a href="{{ url_for('record_detail', record_id=record.id) }}">{{ record.title }}</a></li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
