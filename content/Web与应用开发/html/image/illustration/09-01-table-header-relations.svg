<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-labelledby="title desc">
<title id="title">一个数据单元格，同时由行表头与列表头解释</title><desc id="desc">卷尺行与借出列相交，值 2 表示卷尺借出两件。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526787"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#20365F;font-size:22px} .small{font-size:18px;fill:#526787}.label{font-size:23px;font-weight:600}</style>
<rect width="1040" height="440" fill="white"/>
<text x="32" y="46" text-anchor="start" style="font-size:30px;font-weight:700;fill:#20365F">一个数据单元格，同时由行表头与列表头解释</text>
<rect x="55" y="100" width="150" height="61" rx="12" fill="#EFF8F4" stroke="#8BADED" stroke-width="2"/>
<text x="130.0" y="138.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">工具</text>
<rect x="210" y="100" width="150" height="61" rx="12" fill="#EFF8F4" stroke="#8BADED" stroke-width="2"/>
<text x="285.0" y="138.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">库存</text>
<rect x="365" y="100" width="150" height="61" rx="12" fill="#EFF8F4" stroke="#8BADED" stroke-width="2"/>
<text x="440.0" y="138.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">借出</text>
<rect x="55" y="166" width="150" height="61" rx="12" fill="#EFF8F4" stroke="#8BADED" stroke-width="2"/>
<text x="130.0" y="204.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">卷尺</text>
<rect x="210" y="166" width="150" height="61" rx="12" fill="white" stroke="#8BADED" stroke-width="2"/>
<text x="285.0" y="204.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">4</text>
<rect x="365" y="166" width="150" height="61" rx="12" fill="#F3F0FF" stroke="#8BADED" stroke-width="2"/>
<text x="440.0" y="204.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">2</text>
<rect x="55" y="232" width="150" height="61" rx="12" fill="#EFF8F4" stroke="#8BADED" stroke-width="2"/>
<text x="130.0" y="270.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">钳子</text>
<rect x="210" y="232" width="150" height="61" rx="12" fill="white" stroke="#8BADED" stroke-width="2"/>
<text x="285.0" y="270.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">3</text>
<rect x="365" y="232" width="150" height="61" rx="12" fill="white" stroke="#8BADED" stroke-width="2"/>
<text x="440.0" y="270.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">1</text>
<rect x="55" y="298" width="150" height="61" rx="12" fill="#EFF8F4" stroke="#8BADED" stroke-width="2"/>
<text x="130.0" y="336.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">手锯</text>
<rect x="210" y="298" width="150" height="61" rx="12" fill="white" stroke="#8BADED" stroke-width="2"/>
<text x="285.0" y="336.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">2</text>
<rect x="365" y="298" width="150" height="61" rx="12" fill="white" stroke="#8BADED" stroke-width="2"/>
<text x="440.0" y="336.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">0</text>
<path d="M441 160 L441 171" fill="none" stroke="#526787" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M205 219 L365 219" fill="none" stroke="#526787" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="630" y="152" width="330" height="126" rx="12" fill="#F3F0FF" stroke="#8BADED" stroke-width="2"/>
<text x="795.0" y="193.0" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">行：卷尺</text>
<text x="795.0" y="223.0" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">列：借出</text>
<text x="795.0" y="253.0" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">数值：2 件</text>
<path d="M515 198 L620 198" fill="none" stroke="#526787" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="32" y="416" text-anchor="start" style="font-size:18px;font-weight:400;fill:#526787">本例用 th 的 scope=&quot;row&quot; / scope=&quot;col&quot; 表达关联；视觉位置本身不能替代表头语义。</text>
</svg>
