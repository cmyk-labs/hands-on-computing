<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
<title id="title">源码顺序不等于嵌套结构</title><desc id="desc">错误段落输入解析后，body 中出现 p 开头、div 独立内容、文本结尾和空 p 四个兄弟节点。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526787"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#20365F;font-size:22px} .small{font-size:18px;fill:#526787}.label{font-size:23px;font-weight:600}</style>
<rect width="1040" height="470" fill="white"/>
<text x="32" y="46" text-anchor="start" style="font-size:30px;font-weight:700;fill:#20365F">源码顺序不等于嵌套结构</text>
<rect x="40" y="94" width="960" height="65" rx="12" fill="#ECF3FF" stroke="#8BADED" stroke-width="2"/>
<text x="520.0" y="134.5" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">&lt;p&gt;开头&lt;div&gt;独立内容&lt;/div&gt;结尾&lt;/p&gt;</text>
<path d="M520 159 L520 205" fill="none" stroke="#526787" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="420" y="208" width="200" height="54" rx="12" fill="#EFF8F4" stroke="#8BADED" stroke-width="2"/>
<text x="520.0" y="243.0" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">body</text>
<path d="M520 262 L138 310" fill="none" stroke="#526787" stroke-width="2.5"/>
<rect x="30" y="310" width="216" height="88" rx="12" fill="#ECF3FF" stroke="#8BADED" stroke-width="2"/>
<text x="138.0" y="347.0" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">p</text>
<text x="138.0" y="377.0" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">“开头”</text>
<path d="M520 262 L390 310" fill="none" stroke="#526787" stroke-width="2.5"/>
<rect x="282" y="310" width="216" height="88" rx="12" fill="#EFF8F4" stroke="#8BADED" stroke-width="2"/>
<text x="390.0" y="347.0" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">div</text>
<text x="390.0" y="377.0" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">“独立内容”</text>
<path d="M520 262 L642 310" fill="none" stroke="#526787" stroke-width="2.5"/>
<rect x="534" y="310" width="216" height="88" rx="12" fill="#F3F0FF" stroke="#8BADED" stroke-width="2"/>
<text x="642.0" y="347.0" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">Text</text>
<text x="642.0" y="377.0" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">“结尾”</text>
<path d="M520 262 L894 310" fill="none" stroke="#526787" stroke-width="2.5"/>
<rect x="786" y="310" width="216" height="88" rx="12" fill="#ECF3FF" stroke="#8BADED" stroke-width="2"/>
<text x="894.0" y="347.0" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">p</text>
<text x="894.0" y="377.0" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#20365F">空段落</text>
<text x="32" y="446" text-anchor="start" style="font-size:18px;font-weight:400;fill:#526787">解析结果示意，不是合规写法：div 开始标签结束已有段落，末尾孤立的 &lt;/p&gt; 又产生空 p。</text>
</svg>
