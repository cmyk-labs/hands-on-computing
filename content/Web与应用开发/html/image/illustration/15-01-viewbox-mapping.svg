<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
<title id="title">viewBox 定义坐标，视口决定显示空间</title><desc id="desc">同一个 100 乘 100 坐标方形，在 200 乘 100 视口中保持比例会居中留白，none 会横向拉伸。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526787"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#20365F;font-size:22px} .small{font-size:18px;fill:#526787}.label{font-size:23px;font-weight:600}</style>
<rect width="1040" height="430" fill="white"/>
<text x="32" y="46" text-anchor="start" style="font-size:30px;font-weight:700;fill:#20365F">viewBox 定义坐标，视口决定显示空间</text>
<text x="60" y="102" text-anchor="start" style="font-size:22px;font-weight:600;fill:#20365F">原坐标：100 × 100</text>
<text x="370" y="102" text-anchor="start" style="font-size:22px;font-weight:600;fill:#20365F">xMidYMid meet</text>
<text x="705" y="102" text-anchor="start" style="font-size:22px;font-weight:600;fill:#20365F">none</text>
<rect x="72" y="148" width="180" height="180" rx="0" fill="#EFF8F4" stroke="#8BADED" stroke-width="2"/>
<circle cx="162" cy="238" r="54" fill="#ECF3FF" stroke="#3265D6" stroke-width="2"/>
<text x="102" y="365" text-anchor="start" style="font-size:20px;font-weight:400;fill:#20365F">圆半径 r = 30</text>
<path d="M268 235 L332 235" fill="none" stroke="#526787" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="350" y="193" width="290" height="145" rx="0" fill="#F7F9FC" stroke="#8BADED" stroke-width="2"/>
<rect x="700" y="193" width="290" height="145" rx="0" fill="#F7F9FC" stroke="#8BADED" stroke-width="2"/>
<rect x="422.5" y="193" width="145" height="145" rx="0" fill="#EFF8F4" stroke="#8BADED" stroke-width="2"/>
<circle cx="495" cy="265.5" r="43.5" fill="#ECF3FF" stroke="#3265D6" stroke-width="2"/>
<rect x="700" y="193" width="290" height="145" rx="0" fill="#EFF8F4" stroke="#8BADED" stroke-width="2"/>
<ellipse cx="845" cy="265.5" rx="87" ry="43.5" fill="#ECF3FF" stroke="#3265D6" stroke-width="2"/>
<text x="380" y="365" text-anchor="start" style="font-size:20px;font-weight:400;fill:#20365F">左右各留 50 CSS px</text>
<text x="738" y="365" text-anchor="start" style="font-size:20px;font-weight:400;fill:#20365F">横向 ×2，纵向 ×1</text>
<text x="32" y="406" text-anchor="start" style="font-size:18px;font-weight:400;fill:#526787">C、D 都是 200 × 100 CSS px 的视口；示意图缩放展示，标注数值对应正文代码。</text>
</svg>
