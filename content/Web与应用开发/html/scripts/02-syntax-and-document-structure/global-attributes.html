<!doctype html>
<!-- 所属章节：02-语法与文档结构
     演示知识点：lang、id、class、title 与 data-* 全局属性
     运行命令：python -m http.server 8002 --bind 127.0.0.1（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8002/scripts/02-syntax-and-document-structure/global-attributes.html
     期望结果：英文 span 单独声明 en，class 与 data-* 的值在 Elements 中可读且不显示为正文 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>全局属性实验</title>
</head>
<body>
  <h1>语法学习卡片</h1>
  <!-- intro 和 follow-up 是两个不同的 id；两段共享 note 类。 -->
  <p id="intro" class="note important" data-topic="syntax" data-level="beginner">
    学习记录：<span lang="en">Read the source.</span>
  </p>
  <p id="follow-up" class="note" title="观察元素属性">检查保存后的页面。</p>
  <!-- 预期：普通段落沿用中文声明，英文 span 单独声明 en，不会自动翻译。 -->
  <!-- class 和 data-* 的值可在 Elements 中读取，不自动显示成正文。 -->
  <p><button type="button" data-disabled="false">自定义数据不会禁用按钮</button></p>
  <!-- 复习字符引用：这里显示标签文字、与号和版权符号。 -->
  <p id="literal-text">&lt;p&gt;标签文字&lt;/p&gt; &amp; &copy;</p>
</body>
</html>
