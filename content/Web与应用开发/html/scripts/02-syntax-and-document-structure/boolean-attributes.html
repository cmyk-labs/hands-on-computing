<!doctype html>
<!-- 所属章节：02-语法与文档结构
     演示知识点：布尔属性的三种合规写法与 disabled='false' 反例
     运行命令：python -m http.server 8002 --bind 127.0.0.1（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8002/scripts/02-syntax-and-document-structure/boolean-attributes.html
     期望结果：前四个按钮被禁用，只有无 disabled 属性的按钮可通过 Tab 获得焦点 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>布尔属性实验</title>
</head>
<body>
  <h1>布尔属性实验</h1>
  <!-- 前三种是合规写法；预期三个按钮都被禁用。 -->
  <p><button type="button" disabled>只写属性名</button></p>
  <p><button type="button" disabled="">属性值为空</button></p>
  <p><button type="button" disabled="disabled">属性值等于属性名</button></p>
  <!-- 故意保留反例：false 不是合规布尔属性值，但属性仍存在。 -->
  <p><button type="button" disabled='false'>反例：值为 false</button></p>
  <!-- 预期：只有第五个按钮可通过 Tab 获得焦点；按钮没有绑定动作。 -->
  <p><button type="button">没有 disabled 属性</button></p>
</body>
</html>
