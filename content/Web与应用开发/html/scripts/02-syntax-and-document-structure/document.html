<!doctype html>
<!-- 所属章节：02-语法与文档结构
     演示知识点：文档声明与完整骨架：doctype、head 与 body 分工、title 与 h1 的区别
     运行命令：python -m http.server 8002 --bind 127.0.0.1（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8002/scripts/02-syntax-and-document-structure/document.html
     期望结果：标签页标题为“文档结构实验”，Elements 中 html 下先 head 后 body -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>文档结构实验</title>
</head>
<body>
  <!-- 标签页标题应为“文档结构实验”，正文标题应为“我的语法练习”。 -->
  <h1>我的语法练习</h1>
  <p>保存前请<strong>检查文件名</strong>。</p>
  <!-- 在 Elements 中展开 html：应先看到 head，再看到 body。 -->
  <!-- 在查看页面源代码中能看到这些注释，页面正文中看不到。 -->
</body>
</html>
