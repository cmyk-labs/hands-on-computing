<!doctype html>
<!-- 所属章节：14-多页面网站实践
     演示知识点：子目录内容页：相对路径链接（../）、figure/figcaption 插图与片段定位
     运行命令：python scripts/14-multi-page-site/preview_server.py（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8014/notes/reading.html
     期望结果：插图显示 reading.svg 的书、笔与笔记本，页尾链接分别回到目录页 schedule 区域与表单页 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>给一次阅读留三个位置 · 周末读书会</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <p class="site-name">周末读书会</p>
    <nav aria-label="站点导航">
      <ul>
        <li><a href="../index.html">阅读目录</a></li>
        <li><a href="reading.html" aria-current="page">阅读记录</a></li>
        <li><a href="../join.html">参与意向</a></li>
      </ul>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <article>
      <header>
        <h1>给一次阅读留三个位置</h1>
        <p>记录人：小林 · 原创示例</p>
      </header>
      <section>
        <h2>桌面上留一个位置</h2>
        <p>这次我在桌上放了一本书、一支笔和一本笔记本，
           打算读完一段再停下来写字。</p>
        <figure>
          <img src="../assets/reading.svg" width="600" height="200"
               alt="本次准备：一本书、一支笔、一本笔记本">
          <figcaption>本次阅读准备示意图。</figcaption>
        </figure>
        <!-- 直接打开内容页并刷新，图片应显示书、笔和笔记本；检查 alt 与图注各自表达的信息。 -->
      </section>
      <section>
        <h2>笔记中留一个问题</h2>
        <p>我在笔记里写下：“如果换一个叙述者，这个故事会怎样？”
           这次讨论就从这个问题开始。</p>
      </section>
      <section>
        <h2>周末留一次回看</h2>
        <p>我准备带来原来的问题，再读一遍自己摘下的片段。</p>
        <ol>
          <li>找到想讨论的段落。</li>
          <li>读出自己的问题。</li>
          <li>记下一位同伴的回应。</li>
        </ol>
      </section>
      <footer>
        <p>本文为页面实践所写的虚构记录。</p>
      </footer>
    </article>
    <p><a href="../index.html#schedule">查看活动安排</a></p>
    <p><a href="../join.html">填写参与意向</a></p>
    <!-- “查看活动安排”应定位到目录页的 schedule 区域；“填写参与意向”应打开 /join.html。 -->
  </main>
  <footer class="site-footer">
    <p>周末读书会 · <a href="../index.html">回到阅读目录</a></p>
  </footer>
</body>
</html>
