<!doctype html>
<!-- 所属章节：14-多页面网站实践
     演示知识点：多页面站点的目录页：站点导航与 aria-current 当前页标记、跳转链接与活动安排表
     运行命令：python scripts/14-multi-page-site/preview_server.py（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8014/index.html
     期望结果：三个导航链接可往返且当前页加粗标记，键盘激活跳转链接后焦点进入 main -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阅读目录 · 周末读书会</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <p class="site-name">周末读书会</p>
    <nav aria-label="站点导航">
      <ul>
        <li><a href="index.html" aria-current="page">阅读目录</a></li>
        <li><a href="notes/reading.html">阅读记录</a></li>
        <li><a href="join.html">参与意向</a></li>
      </ul>
    </nav>
    <!-- 逐一打开三个链接；在各页核对当前页标记和页面标题。 -->
  </header>
  <main id="main" tabindex="-1">
    <h1>阅读目录</h1>
    <!-- 在页首按 Tab、Enter 激活跳转，焦点应进入 main；下一次 Tab 到“给一次阅读留三个位置”。 -->
    <p>带上一篇读过的短文，把一个还没想清楚的问题留给周末。</p>
    <section>
      <h2>本期阅读</h2>
      <ul>
        <li>
          <a href="notes/reading.html">给一次阅读留三个位置</a>
          <!-- 点击后进入 /notes/reading.html；页面地址与 Notebook 的文件链接写法不同。 -->
          <p>一篇原创示例记录：准备物品、留下问题、回看笔记。</p>
        </li>
      </ul>
    </section>
    <section id="schedule">
      <h2>活动安排</h2>
      <p>以下为虚构场次，供本机练习选择。</p>
      <table>
        <caption>周末两场讨论安排</caption>
        <thead>
          <tr><th scope="col">场次</th><th scope="col">时段</th><th scope="col">讨论内容</th></tr>
        </thead>
        <tbody>
          <tr><th scope="row">周六场</th><td>14:00–14:40</td><td>交流阅读问题</td></tr>
          <tr><th scope="row">周日场</th><td>10:00–10:40</td><td>分享笔记片段</td></tr>
        </tbody>
      </table>
      <!-- 阅读周六、周日两行时，应能辨认场次、时段和讨论内容之间的对应关系。 -->
      <p><a href="join.html">选择想参加的场次</a></p>
    </section>
  </main>
  <footer class="site-footer">
    <p>周末读书会 · 本地练习站</p>
  </footer>
</body>
</html>
