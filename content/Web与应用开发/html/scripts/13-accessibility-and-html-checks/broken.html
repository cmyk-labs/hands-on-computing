<!doctype html>
<!-- 所属章节：13-可访问性与 HTML 检查
     演示知识点：故意反例：缺少页面语言、重复 id、错误嵌套、role 按钮缺键盘行为及 404 样式表
     运行命令：python -m http.server 8013 --bind 127.0.0.1（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8013/scripts/13-accessibility-and-html-checks/broken.html
     期望结果：点击“记录人”聚焦的却是第一个输入框，div 按钮用 Enter/空格不触发，Network 中 missing.css 为 404 -->
<!-- 故意反例：缺少页面语言、重复 id、错误嵌套和不完整的按钮行为。 -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>读书记录 · 待修正示例</title>
  <link rel="stylesheet" href="styles.css">
  <!-- 此文件故意不存在；在 Network 中观察404。 -->
  <link rel="stylesheet" href="missing.css">
  <script src="inspect.js" defer></script>
</head>
<body>
  <h1>读书记录：待修正示例</h1>
  <p>本页保留错误供检查，请与修正页比较。</p>
  <p><label for="entry">书名</label><input id="entry" name="book"></p>
  <p><label for="entry">记录人</label><input id="entry" name="reader"></p>
  <!-- 点击“记录人”却聚焦第一个输入框；在 Accessibility 中对照两框的计算名称。 -->
  <!-- role 只提供语义，下面没有补写键盘行为。 -->
  <div class="pretend-button" role="button" tabindex="0" data-action="mark">标为已读</div>
  <p id="action-result" role="status">尚未标记。</p>
  <!-- 普通键盘操作下，Enter 和空格不会触发本例的 div 动作；鼠标点击可以。 -->
  <div id="nesting-case">
    <p id="intro">阅读说明<div id="inner-block">每天记录一个问题。</div>保留自己的想法。</p>
    <!-- 对照源代码与 Elements：inner-block 不会成为 intro 段落的子元素。 -->
  </div>
  <p><a href="fixed.html">查看修正示例</a></p>
</body>
</html>
