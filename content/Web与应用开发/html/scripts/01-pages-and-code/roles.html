<!doctype html>
<!-- 所属章节：01-页面运行与代码书写
     演示知识点：HTML、CSS 与 JavaScript 的配合：link 引入 styles.css，页面元素之后再引入 script.js
     运行命令：python -m http.server 8000 --bind 127.0.0.1（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8000/scripts/01-pages-and-code/roles.html
     期望结果：页面应用外部样式，点击按钮后段落变为“JavaScript 已更新这段文字。” -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML、CSS 与 JavaScript</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>网页中的三种技术</h1>
  <p id="status">还没有点击按钮。</p>
  <button type="button">更新文字</button>
  <p><a href="index.html">返回第一个页面</a></p>
  <!-- 本例先创建页面元素，再运行使用这些元素的脚本。 -->
  <script src="script.js"></script>
</body>
</html>
