<!doctype html>
<!-- 所属章节：01-页面运行与代码书写
     演示知识点：保存、打开和修改完整页面：doctype、lang、charset、viewport、title 与 h1 的分工
     运行命令：python -m http.server 8000 --bind 127.0.0.1（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8000/scripts/01-pages-and-code/index.html
     期望结果：标签页显示 title，页面内显示 h1 大标题、段落与指向 roles.html 的链接 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的第一个 HTML 页面</title>
</head>
<body>
  <!-- 浏览器标签页看 title，页面内的大标题看 h1。 -->
  <h1>我的学习笔记</h1>
  <p>我正在学习用 HTML 组织网页内容。</p>
  <p><a href="roles.html">查看 HTML、CSS 与 JavaScript 的配合</a></p>
</body>
</html>
