<!doctype html>
<!-- 所属章节：07-图像与响应式图像
     演示知识点：首屏 eager+fetchpriority=high 与下方 lazy 图像的加载策略
     运行命令：python -m http.server 8007 --bind 127.0.0.1（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8007/scripts/07-images-and-responsive-images/loading.html
     期望结果：首屏全景立即请求，滚动到近景后 cabin-480.svg 才发起请求 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图像加载策略</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>沿着湖岸走走</h1>
    <p><a href="index.html">返回图像实验</a></p>
    <figure>
      <img class="scene" src="lake-960.svg" width="960" height="540"
           loading="eager" fetchpriority="high"
           alt="蓝色湖泊左岸有红色小屋，远山延伸到湖泊后方。">
      <figcaption>出发前，先看看湖岸全景。</figcaption>
    </figure>
    <div class="load-spacer">
      <p>向下滚动，看看小屋入口。这里留出空间供观察延迟加载。</p>
    </div>
    <figure>
      <img id="lazy-image" class="scene" src="cabin-480.svg"
           width="480" height="480" loading="lazy"
           decoding="async" fetchpriority="low"
           alt="湖边红色小屋的近景，浅黄色门位于正面。">
      <figcaption>走近小屋，可以看清入口。</figcaption>
    </figure>
  </main>
  <!-- 检查：Network 开启 Disable cache 后，在页面顶部刷新并向下滚动。 -->
  <!-- 观察 cabin-480.svg 的请求时机；浏览器可能在图片进入视口前就请求。 -->
  <!-- 预期滚动到下方后近景可以加载；不要求某个固定距离才发起请求。 -->
</body>
</html>
