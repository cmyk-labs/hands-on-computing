<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>社区工具站 · 简单表格</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>可借工具摘录</h1>
    <p>教学数据，数量单位为件。</p>
    <table>
      <caption>可借工具摘录（件）</caption>
      <tbody>
        <tr><th scope="col">工具</th><th scope="col">可借数量</th></tr>
        <tr><th scope="row">卷尺</th><td>4</td></tr>
      </tbody>
    </table>
    <!-- 4 表示卷尺可借 4 件；表格标题说明主题与单位。 -->
    <p><a href="index.html">查看完整库存表</a></p>
  </main>
</body>
</html>
