<!doctype html>
<!-- 所属章节：09-数据表格
     演示知识点：最小表格：caption 表名、th/td 分工与 scope 标注行、列表头
     运行命令：python -m http.server 8009 --bind 127.0.0.1（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8009/scripts/09-data-tables/basic.html
     期望结果：页面显示带标题“可借工具摘录（件）”的两列表格，卷尺行给出可借数量 4 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>社区工具站 · 简单表格</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>可借工具摘录</h1>
    <p>教学数据，数量单位为件。</p>
    <table>
      <caption>可借工具摘录（件）</caption>
      <tbody>
        <tr><th scope="col">工具</th><th scope="col">可借数量</th></tr>
        <tr><th scope="row">卷尺</th><td>4</td></tr>
      </tbody>
    </table>
    <!-- 4 表示卷尺可借 4 件；表格标题说明主题与单位。 -->
    <p><a href="index.html">查看完整库存表</a></p>
  </main>
</body>
</html>
