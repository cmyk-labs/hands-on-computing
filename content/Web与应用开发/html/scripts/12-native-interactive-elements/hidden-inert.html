<!doctype html>
<!-- 所属章节：12-原生交互元素
     演示知识点：hidden 显隐切换、inert 停用交互与 hidden="until-found" 查找后显现
     运行命令：python -m http.server 8012 --bind 127.0.0.1（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8012/scripts/12-native-interactive-elements/hidden-inert.html
     期望结果：勾选“允许编辑”后 Tab 才能进入编辑区，Ctrl+F 查找“纸鹤归档”时归档说明显现 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hidden、inert 与恢复交互</title>
</head>
<body>
  <main>
    <h1>阅读记录的可用区域</h1>
    <h2>补充说明</h2>
    <button id="reveal-extra" type="button">查看补充说明</button>
    <section id="extra-note" hidden aria-labelledby="extra-title">
      <h3 id="extra-title">当前补充说明</h3>
      <p>本次只整理自己正在阅读的内容。</p>
      <button id="hide-extra" type="button">收起补充说明</button>
    </section>

    <h2>编辑区</h2>
    <p><label><input id="enable-edit" type="checkbox">允许编辑</label></p>
    <p id="edit-state" role="status">编辑区暂不可交互。</p>
    <div id="edit-area" inert>
      <p><label for="draft-text">记录内容：</label>
        <input id="draft-text" value="留一个问题"></p>
      <p><a href="#archive-title">前往归档标题</a></p>
    </div>

    <h2 id="archive-title">归档</h2>
    <p><a href="#archived-note">查找归档说明</a></p>
    <section id="archived-note" hidden="until-found">
      <h3>归档说明</h3>
      <p>纸鹤归档：较早的记录按主题保存。</p>
    </section>
  </main>
  <script>
    const extra = document.querySelector("#extra-note");
    const reveal = document.querySelector("#reveal-extra");
    const hide = document.querySelector("#hide-extra");
    const enable = document.querySelector("#enable-edit");
    const editArea = document.querySelector("#edit-area");
    const editState = document.querySelector("#edit-state");

    reveal.addEventListener("click", () => {
      extra.hidden = false;
      hide.focus();
    });
    hide.addEventListener("click", () => {
      // 先将焦点移出将被隐藏的子树，再隐藏，保留可继续操作的入口。
      reveal.focus();
      extra.hidden = true;
    });
    enable.addEventListener("change", () => {
      editArea.inert = !enable.checked;
      editState.textContent = enable.checked ? "编辑区可以交互。" : "编辑区暂不可交互。";
    });
  </script>
  <!-- 初始：补充说明不显示，编辑区仍可见但输入框与内部链接不能聚焦或点击。 -->
  <!-- 打开补充说明后聚焦 hide-extra；收起后应回到 reveal-extra。 -->
  <!-- 勾选允许编辑：Tab 可进入 draft-text 并编辑；取消勾选后再次跳过编辑区。 -->
  <!-- 检查 Accessibility：停用区控件不应仍作为可操作控件暴露，启用后再比较。 -->
  <!-- 点击“查找归档说明”或用 Ctrl+F 查找“纸鹤归档”：支持 until-found 时内容显现。 -->
  <!-- 归档被揭示后 hidden 被移除；刷新可恢复文件的初始状态。 -->
</body>
</html>
