<!doctype html>
<!-- 所属章节：17-HTML 解析与兼容
     演示知识点：同一输入的 HTML 与 XML 解析差异：缺失结束标签的 parsererror 与自闭合斜线的不同树
     运行命令：python scripts/17-parsing-and-compatibility/preview_server.py（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8017/xml.html
     期望结果：缺结束标签的 XML 报 parsererror 而修复后通过，斜线例中 HTML 的 p 父元素为 div、XML 为 section -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML 与 XML 解析器</title>
</head>
<body>
  <h1>HTML 与 XML 解析器</h1>
  <h2>缺失结束标签：XML 预期失败</h2>
  <pre id="failure">等待脚本执行。</pre>
  <h2>斜线：HTML 与 XML 的不同结果</h2>
  <pre id="slash">等待脚本执行。</pre>
  <p><a href="dom.html">返回实验入口</a></p>
  <script>
    const parser = new DOMParser();
    const missingEnd = "<ul><li>阅读<li>整理</ul>";
    const htmlList = parser.parseFromString(missingEnd, "text/html");
    const badXml = parser.parseFromString(missingEnd, "application/xml");
    const xmlError = badXml.querySelector("parsererror");
    const fixedXml = parser.parseFromString(
      "<ul><li>阅读</li><li>整理</li></ul>", "application/xml"
    );
    const fixedError = fixedXml.querySelector("parsererror");
    document.querySelector("#failure").textContent = JSON.stringify({
      source: missingEnd,
      htmlBody: htmlList.body.innerHTML,
      xmlFailedAsExpected: xmlError !== null,
      xmlError: xmlError ? xmlError.textContent.trim() : null,
      repairedXmlHasNoError: fixedError === null,
      repairedItemCount: fixedXml.querySelectorAll("li").length
    }, null, 2);
    // 预期 XML 失败被显式核对；修复后的 XML 必须通过，后续示例才能继续。
    // 不要求不同浏览器的错误文字完全相同，只核对错误存在与修复结果。
    if (xmlError === null || fixedError !== null) {
      throw new Error("XML 反例或修复未达到预期，请检查实际结果。");
    }

    const slashSource =
      '<section xmlns="http://www.w3.org/1999/xhtml">' +
      '<div id="box"/><p id="after">后续段落</p></section>';
    const htmlSlash = parser.parseFromString(slashSource, "text/html");
    const xmlSlash = parser.parseFromString(slashSource, "application/xml");
    if (xmlSlash.querySelector("parsererror")) {
      throw new Error("斜线对照输入应是格式良好的 XML。");
    }
    const htmlParent = htmlSlash.querySelector("#after").parentElement.localName;
    const xmlParent = xmlSlash.querySelector("#after").parentElement.localName;
    document.querySelector("#slash").textContent = JSON.stringify({
      source: slashSource,
      htmlBody: htmlSlash.body.innerHTML,
      htmlParent: htmlParent,
      xmlParent: xmlParent,
      matches: htmlParent === "div" && xmlParent === "section"
    }, null, 2);
    // 预期：HTML 中 p 的父元素为 div；XML 中 p 与空 div 同属 section。
    // XML 无错误仅说明这里的语法可解析，不代表做了 HTML 内容模型校验。
    console.assert(htmlParent === "div" && xmlParent === "section");
  </script>
</body>
</html>
