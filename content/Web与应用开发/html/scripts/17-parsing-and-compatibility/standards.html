<!doctype html>
<!-- 所属章节：17-HTML 解析与兼容
     演示知识点：带 DOCTYPE 的标准模式页：读取 contentType、doctype 与 compatMode
     运行命令：python scripts/17-parsing-and-compatibility/preview_server.py（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8017/standards.html
     期望结果：报告 hasDoctype 为 true、compatMode 为 CSS1Compat -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文档模式对照</title>
</head>
<body>
  <h1>文档模式对照</h1>
  <p>检查文档开头的 DOCTYPE，并读取当前模式。</p>
  <pre id="report">等待浏览器读取。</pre>
  <p><a href="dom.html">返回实验入口</a></p>
  <script>
    document.querySelector("#report").textContent = JSON.stringify({
      contentType: document.contentType,
      hasDoctype: document.doctype !== null,
      compatMode: document.compatMode
    }, null, 2);
    // 有 DOCTYPE 时预期 CSS1Compat；无 DOCTYPE 时预期 BackCompat。
    // 两页看起来可能相同，不能仅凭外观判断模式。
  </script>
</body>
</html>
