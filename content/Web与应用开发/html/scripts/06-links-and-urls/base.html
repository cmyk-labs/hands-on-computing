<!doctype html>
<!-- 所属章节：06-链接与 URL
     演示知识点：base href 基准目录对相对链接的解析
     运行命令：python -m http.server 8006 --bind 127.0.0.1（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8006/scripts/06-links-and-urls/base.html
     期望结果：guide.html 从 pages/ 基准解析，打开 pages/guide.html -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>&lt;base&gt;：基准目录</title>
  <base href="pages/">
</head>
<body>
  <h1>&lt;base&gt;：基准目录</h1>
  <p><a href="guide.html">打开出行指南</a></p>
  <!-- 预期：从 pages/ 解析 guide.html，打开同一站点下的 pages/guide.html。 -->
  <p><a href="../index.html">返回链接实验导航</a></p>
</body>
</html>
