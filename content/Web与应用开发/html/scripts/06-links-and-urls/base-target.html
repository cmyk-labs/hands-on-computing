<!doctype html>
<!-- 所属章节：06-链接与 URL
     演示知识点：base target 默认打开位置与链接自身 target 的覆盖
     运行命令：python -m http.server 8006 --bind 127.0.0.1（工作目录 content/Web与应用开发/html）；浏览器打开 http://127.0.0.1:8006/scripts/06-links-and-urls/base-target.html
     期望结果：第一项在新窗口打开指南，第二项以 _self 在当前页打开 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>&lt;base&gt;：默认打开位置</title>
  <base target="_blank">
</head>
<body>
  <h1>&lt;base&gt;：默认打开位置</h1>
  <p><a href="pages/guide.html">打开指南（新窗口或标签页）</a></p>
  <p><a href="pages/guide.html" target="_self">打开指南（当前页）</a></p>
  <!-- 两项打开同一指南；第一项使用默认 target，第二项覆盖它。 -->
  <p><a href="index.html" target="_self">返回链接实验导航</a></p>
</body>
</html>
