<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
<title id="title">对象赋值：来源要满足目标要求</title><desc id="desc">只讨论本例的普通结构类型；赋值不会删除对象的额外属性。</desc>
<metadata>Original illustration by CMYK Labs (cmyk-labs); CC BY-NC-SA 4.0.</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#5374AB"/></marker></defs>
<rect width="960" height="310" fill="white"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#20365F">
<text x="32" y="40" font-size="26" text-anchor="start" fill="#20365F" font-weight="700">对象赋值：来源要满足目标要求</text>
<text x="32" y="72" font-size="15" text-anchor="start" fill="#20365F">只讨论本例的普通结构类型；赋值不会删除对象的额外属性。</text>
<rect x="45" y="135" width="345" height="90" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="217.5" y="173.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">来源 detailed: Timed</text>
<text x="217.5" y="199.0" font-size="18" text-anchor="middle" fill="#20365F">title + minutes</text>
<rect x="590" y="135" width="325" height="90" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="752.5" y="173.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">目标 named: Named</text>
<text x="752.5" y="199.0" font-size="18" text-anchor="middle" fill="#20365F">要求 title</text>
<polyline points="390,180 590,180" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="490" y="162" font-size="15" text-anchor="middle" fill="#20365F">可赋值</text>
<text x="32" y="290" font-size="15" text-anchor="start" fill="#20365F">反向缺少 minutes，不能作为 Timed；直接对象字面量还要考虑本章下一节的额外属性检查。</text>
</g></svg>
