<svg xmlns="http://www.w3.org/2000/svg" width="960" height="385" viewBox="0 0 960 385" role="img" aria-labelledby="title desc">
<title id="title">条件导出把声明与运行文件配成对</title><desc id="desc">以 package.json 的根入口为例；消费者按包名访问。</desc>
<metadata>Original illustration by CMYK Labs (cmyk-labs); CC BY-NC-SA 4.0.</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#5374AB"/></marker></defs>
<rect width="960" height="385" fill="white"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#20365F">
<text x="32" y="40" font-size="26" text-anchor="start" fill="#20365F" font-weight="700">条件导出把声明与运行文件配成对</text>
<text x="32" y="72" font-size="15" text-anchor="start" fill="#20365F">以 package.json 的根入口为例；消费者按包名访问。</text>
<rect x="30" y="145" width="200" height="100" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="130.0" y="201.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">根入口 &quot;.&quot;</text>
<rect x="320" y="110" width="210" height="72" rx="12" fill="#F3F0FF" stroke="#AA9BDE" stroke-width="1.8"/>
<text x="425.0" y="152.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">import 条件</text>
<rect x="320" y="255" width="210" height="72" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="425.0" y="297.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">require 条件</text>
<rect x="655" y="95" width="275" height="100" rx="12" fill="#F3F0FF" stroke="#AA9BDE" stroke-width="1.8"/>
<text x="792.5" y="138.0" font-size="16" text-anchor="middle" fill="#20365F" font-weight="700">types: modern.d.mts</text>
<text x="792.5" y="164.0" font-size="16" text-anchor="middle" fill="#20365F">default: modern.mjs</text>
<rect x="655" y="245" width="275" height="100" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="792.5" y="288.0" font-size="16" text-anchor="middle" fill="#20365F" font-weight="700">types: legacy.d.cts</text>
<text x="792.5" y="314.0" font-size="16" text-anchor="middle" fill="#20365F">default: legacy.cjs</text>
<polyline points="230,170 320,146" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="230,220 270,220 270,291 320,291" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="530,146 655,146" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="530,291 655,295" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="32" y="365" font-size="15" text-anchor="start" fill="#20365F">图中省略共同的 dist/ 前缀与 ./plain 子入口；声明供检查，default 文件供相应运行时加载。</text>
</g></svg>
