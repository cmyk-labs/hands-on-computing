<svg xmlns="http://www.w3.org/2000/svg" width="960" height="365" viewBox="0 0 960 365" role="img" aria-labelledby="title desc">
<title id="title">paths 解析成功不等于 Node 能加载</title><desc id="desc">本例仅给 TypeScript 配置了 @lesson/value 的映射。</desc>
<metadata>Original illustration by CMYK Labs (cmyk-labs); CC BY-NC-SA 4.0.</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#5374AB"/></marker></defs>
<rect width="960" height="365" fill="white"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#20365F">
<text x="32" y="40" font-size="26" text-anchor="start" fill="#20365F" font-weight="700">paths 解析成功不等于 Node 能加载</text>
<text x="32" y="72" font-size="15" text-anchor="start" fill="#20365F">本例仅给 TypeScript 配置了 @lesson/value 的映射。</text>
<rect x="35" y="145" width="300" height="84" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="185.0" y="180.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">alias-only.ts</text>
<text x="185.0" y="206.0" font-size="17" text-anchor="middle" fill="#20365F">&quot;@lesson/value&quot;</text>
<rect x="530" y="100" width="390" height="70" rx="12" fill="#F3F0FF" stroke="#AA9BDE" stroke-width="1.8"/>
<text x="725.0" y="128.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">检查：paths → ./value.ts</text>
<text x="725.0" y="154.0" font-size="17" text-anchor="middle" fill="#20365F">能取得类型</text>
<rect x="530" y="235" width="390" height="80" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="725.0" y="268.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">生成：说明符保持不变</text>
<text x="725.0" y="294.0" font-size="17" text-anchor="middle" fill="#20365F">Node 查找同名包失败</text>
<polyline points="335,167 530,135" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="430" y="122" font-size="15" text-anchor="middle" fill="#20365F">检查解析</text>
<polyline points="335,204 423,204 423,275 530,275" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="426" y="245" font-size="15" text-anchor="middle" fill="#20365F">输出与运行</text>
<text x="32" y="345" font-size="15" text-anchor="start" fill="#20365F">下一节用 Node 与 TypeScript 都理解的包映射对齐入口；paths 自身不改写导入。</text>
</g></svg>
