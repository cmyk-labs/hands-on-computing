<svg xmlns="http://www.w3.org/2000/svg" width="960" height="385" viewBox="0 0 960 385" role="img" aria-labelledby="title desc">
<title id="title">检查、生成、运行分别完成什么</title><desc id="desc">三个 npm 入口是本章命令约定；检查通过不会自动运行程序。</desc>
<metadata>Original illustration by CMYK Labs (cmyk-labs); CC BY-NC-SA 4.0.</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#5374AB"/></marker></defs>
<rect width="960" height="385" fill="white"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#20365F">
<text x="32" y="40" font-size="26" text-anchor="start" fill="#20365F" font-weight="700">检查、生成、运行分别完成什么</text>
<text x="32" y="72" font-size="15" text-anchor="start" fill="#20365F">三个 npm 入口是本章命令约定；检查通过不会自动运行程序。</text>
<rect x="35" y="135" width="220" height="90" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="145.0" y="173.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">greeting.ts</text>
<text x="145.0" y="199.0" font-size="17" text-anchor="middle" fill="#20365F">带参数类型标注</text>
<rect x="355" y="115" width="250" height="62" rx="12" fill="#F3F0FF" stroke="#AA9BDE" stroke-width="1.8"/>
<text x="480.0" y="139.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">check:01</text>
<text x="480.0" y="165.0" font-size="17" text-anchor="middle" fill="#20365F">只检查，不生成</text>
<rect x="355" y="225" width="250" height="62" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="480.0" y="249.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">build:01</text>
<text x="480.0" y="275.0" font-size="17" text-anchor="middle" fill="#20365F">检查并生成</text>
<rect x="700" y="225" width="225" height="62" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="812.5" y="249.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">greeting.js</text>
<text x="812.5" y="275.0" font-size="17" text-anchor="middle" fill="#20365F">类型标注已擦除</text>
<polyline points="255,160 355,146" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="255,194 310,194 310,256 355,256" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="605,256 700,256" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="700" y="315" width="225" height="48" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="812.5" y="345.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">run:01 → Node.js</text>
<polyline points="812,287 812,315" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="32" y="365" font-size="15" text-anchor="start" fill="#20365F">本章设置 noEmitOnError；生成失败后，旧的 JavaScript 不能作为当前源码通过的证据。</text>
</g></svg>
