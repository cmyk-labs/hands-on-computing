[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "study-plugin-demo"
version = "0.1.0"
description = "Local trusted plugin examples for a Python notebook"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."study_plugin_demo.formatters.v1"]
upper = "study_formatters.good:format_text"
broken = "study_formatters.bad:not_a_function"
reject = "study_formatters.bad:reject_text"
dependency = "study_formatters.dependency:format_text"

[tool.setuptools.packages.find]
where = ["src"]
include = ["study_formatters"]
namespaces = false

[tool.ruff.lint.isort]
known-first-party = ["plugin_host"]
