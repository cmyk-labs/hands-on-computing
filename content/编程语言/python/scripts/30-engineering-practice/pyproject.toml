[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "study-file-report"
version = "0.1.0"
description = "综合工程实践的文本文件分析示例"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
study-file-report = "study_file_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
