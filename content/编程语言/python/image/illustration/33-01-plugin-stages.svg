<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">插件：发现、加载与调用分开</title><desc id="desc">发现记录不等于已经执行插件；加载会导入代码，因此需要可信来源。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597AAA"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20365F">
<text x="40" y="42" font-size="27" text-anchor="start" font-weight="600" fill="#20365F">插件：发现、加载与调用分开</text>
<rect x="40.0" y="120" width="200.0" height="105" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="140.0" y="151" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">发现</text>
<text x="140.0" y="180" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">读取候选名称</text>
<text x="140.0" y="205" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">或入口点元数据</text>
<rect x="280.0" y="120" width="200.0" height="105" rx="14" fill="#EFF8F4" stroke="#597AAA" stroke-width="1.7"/>
<text x="380.0" y="151" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">选择</text>
<text x="380.0" y="180" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">检查名称与接口组</text>
<path d="M240.0,172 L277.0,172" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="520.0" y="120" width="200.0" height="105" rx="14" fill="#F3F0FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="620.0" y="151" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">加载</text>
<text x="620.0" y="180" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">EntryPoint.load()</text>
<text x="620.0" y="205" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">导入入口对象</text>
<path d="M480.0,172 L517.0,172" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="760.0" y="120" width="200.0" height="105" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="860.0" y="151" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">调用</text>
<text x="860.0" y="180" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">传入业务输入</text>
<text x="860.0" y="205" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">检查约定结果</text>
<path d="M720.0,172 L757.0,172" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="325" font-size="17" text-anchor="start" font-weight="400" fill="#20365F">发现记录不等于已经执行插件；加载会导入代码，因此需要可信来源。</text>
</g></svg>
