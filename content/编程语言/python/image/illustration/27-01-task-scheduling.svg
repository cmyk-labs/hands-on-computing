<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">先创建任务，再等待结果</title><desc id="desc">两个任务等待期间交错推进，事件循环同一时刻运行一个任务。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597AAA"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20365F">
<text x="40" y="42" font-size="27" text-anchor="start" font-weight="600" fill="#20365F">先创建任务，再等待结果</text>
<path d="M160,335 L950,335" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="555.0" y="325.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">时间向右；示意顺序不作为输出保证</text>
<text x="40" y="148" font-size="20" text-anchor="start" font-weight="600" fill="#20365F">Task A</text>
<text x="40" y="258" font-size="20" text-anchor="start" font-weight="600" fill="#20365F">Task B</text>
<rect x="160" y="110" width="165" height="65" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="242.5" y="149" font-size="18" text-anchor="middle" font-weight="400" fill="#20365F">开始</text>
<rect x="325" y="110" width="365" height="65" rx="14" fill="#F5F7FC" stroke="#597AAA" stroke-width="1.7"/>
<text x="507.5" y="149" font-size="18" text-anchor="middle" font-weight="400" fill="#20365F">让出后等待调度</text>
<rect x="690" y="110" width="190" height="65" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="785.0" y="149" font-size="18" text-anchor="middle" font-weight="400" fill="#20365F">继续 / 完成</text>
<rect x="325" y="220" width="165" height="65" rx="14" fill="#EFF8F4" stroke="#597AAA" stroke-width="1.7"/>
<text x="407.5" y="259" font-size="18" text-anchor="middle" font-weight="400" fill="#20365F">开始</text>
<rect x="490" y="220" width="390" height="65" rx="14" fill="#F5F7FC" stroke="#597AAA" stroke-width="1.7"/>
<text x="685.0" y="259" font-size="18" text-anchor="middle" font-weight="400" fill="#20365F">让出后等待调度</text>
<rect x="880" y="220" width="80" height="65" rx="14" fill="#EFF8F4" stroke="#597AAA" stroke-width="1.7"/>
<text x="920.0" y="259" font-size="18" text-anchor="middle" font-weight="400" fill="#20365F">完成</text>
<text x="40" y="375" font-size="17" text-anchor="start" font-weight="400" fill="#20365F">只有实际挂起的等待才让出执行机会；依次 await 已创建的任务不等于依次创建任务。</text>
</g></svg>
