<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="631" viewBox="0 0 1000 631" role="img" aria-labelledby="title desc">
<title id="title">生成器：调用方推动一次，函数运行到下一处暂停</title><desc id="desc">箭头按时间自上而下；暂停时保留局部变量与当前位置。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597AAA"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20365F">
<text x="40" y="42" font-size="27" text-anchor="start" font-weight="600" fill="#20365F">生成器：调用方推动一次，函数运行到下一处暂停</text>
<rect x="25.0" y="75" width="210" height="52" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="130.0" y="106" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">调用方</text>
<path d="M130.0,130 L130.0,571" stroke="#A7BAD6" stroke-dasharray="5 5" stroke-width="1.5"/>
<rect x="765.0" y="75" width="210" height="52" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="870.0" y="106" font-size="19" text-anchor="middle" font-weight="600" fill="#20365F">generate_countdown</text>
<path d="M870.0,130 L870.0,571" stroke="#A7BAD6" stroke-dasharray="5 5" stroke-width="1.5"/>
<path d="M130.0,173 L870.0,173" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500.0" y="163.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">创建 steps：只取得生成器对象</text>
<path d="M130.0,236 L870.0,236" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500.0" y="226.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">next：开始执行，remaining = 2</text>
<path d="M870.0,299 L130.0,299" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500.0" y="289.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">yield 2：交回值并暂停</text>
<path d="M130.0,362 L870.0,362" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500.0" y="352.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">next：继续执行，remaining 减为 1</text>
<path d="M870.0,425 L130.0,425" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500.0" y="415.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">yield 1：再次暂停</text>
<path d="M130.0,488 L870.0,488" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500.0" y="478.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">next：继续到函数结束</text>
<path d="M870.0,551 L130.0,551" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500.0" y="541.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">耗尽：next 的默认值为“耗尽”</text>
<text x="40" y="606" font-size="17" text-anchor="start" font-weight="400" fill="#20365F">箭头按时间自上而下；暂停时保留局部变量与当前位置。</text>
</g></svg>
