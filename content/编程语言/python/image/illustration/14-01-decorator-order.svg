<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">叠加装饰器：求值、应用、调用是三个阶段</title><desc id="desc">外层与内层装饰器的三个不同顺序。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597AAA"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20365F">
<text x="40" y="42" font-size="27" text-anchor="start" font-weight="600" fill="#20365F">叠加装饰器：求值、应用、调用是三个阶段</text>
<text x="40" y="137" font-size="20" text-anchor="start" font-weight="600" fill="#20365F">定义：求值</text>
<rect x="260" y="105" width="195" height="60" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="357.5" y="136" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">外表达式</text>
<rect x="490" y="105" width="195" height="60" rx="14" fill="#EFF8F4" stroke="#597AAA" stroke-width="1.7"/>
<text x="587.5" y="136" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">内表达式</text>
<path d="M455,135 L487,135" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="257" font-size="20" text-anchor="start" font-weight="600" fill="#20365F">定义：应用</text>
<rect x="260" y="225" width="195" height="60" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="357.5" y="256" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">内装饰器</text>
<rect x="490" y="225" width="195" height="60" rx="14" fill="#EFF8F4" stroke="#597AAA" stroke-width="1.7"/>
<text x="587.5" y="256" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">外装饰器</text>
<path d="M455,255 L487,255" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="377" font-size="20" text-anchor="start" font-weight="600" fill="#20365F">调用：进入</text>
<rect x="260" y="345" width="195" height="60" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="357.5" y="376" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">外 wrapper</text>
<rect x="490" y="345" width="195" height="60" rx="14" fill="#EFF8F4" stroke="#597AAA" stroke-width="1.7"/>
<text x="587.5" y="376" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">内 wrapper</text>
<path d="M455,375 L487,375" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="720" y="345" width="195" height="60" rx="14" fill="#F3F0FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="817.5" y="376" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">原函数</text>
<path d="M685,375 L717,375" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="435" font-size="17" text-anchor="start" font-weight="400" fill="#20365F">本例调用结束时，退出记录按内层 → 外层出现；应用完成不等于原函数已运行。</text>
</g></svg>
