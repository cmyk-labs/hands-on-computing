<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">浅拷贝：外层不同，内层仍可共享</title><desc id="desc">source、shallow 和 deep 三个字典及内层列表的关系。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597AAA"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20365F">
<text x="40" y="42" font-size="27" text-anchor="start" font-weight="600" fill="#20365F">浅拷贝：外层不同，内层仍可共享</text>
<rect x="40" y="100" width="270" height="90" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="175.0" y="131" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">source</text>
<text x="175.0" y="160" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">独立的外层字典</text>
<rect x="365" y="100" width="270" height="90" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="500.0" y="131" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">shallow</text>
<text x="500.0" y="160" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">独立的外层字典</text>
<rect x="690" y="100" width="270" height="90" rx="14" fill="#F3F0FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="825.0" y="131" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">deep</text>
<text x="825.0" y="160" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">独立的外层字典</text>
<rect x="180" y="285" width="325" height="85" rx="14" fill="#EFF8F4" stroke="#597AAA" stroke-width="1.7"/>
<text x="342.5" y="316" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">同一列表 [80, 90]</text>
<text x="342.5" y="345" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">source 与 shallow 共同引用</text>
<rect x="670" y="285" width="290" height="85" rx="14" fill="#F3F0FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="815.0" y="316" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">另一列表 [80, 90]</text>
<text x="815.0" y="345" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">deep 在本例复制内层列表</text>
<path d="M175,190 L285,285" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="230.0" y="227.5" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">scores</text>
<path d="M500,190 L425,285" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="462.5" y="227.5" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">scores</text>
<path d="M825,190 L815,285" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="820.0" y="227.5" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">scores</text>
<text x="40" y="435" font-size="17" text-anchor="start" font-weight="400" fill="#20365F">图示为 append(95) 前；添加 note 只改变 shallow，追加分数会影响共享列表。</text>
</g></svg>
