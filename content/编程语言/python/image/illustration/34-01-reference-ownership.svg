<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">借用与新引用指向同一个对象</title><desc id="desc">元组保持元素存活，Py_NewRef取得同一元素的新强引用后返回调用者。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597AAA"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20365F">
<text x="40" y="42" font-size="27" text-anchor="start" font-weight="600" fill="#20365F">借用与新引用指向同一个对象</text>
<rect x="45" y="95" width="280" height="90" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="185.0" y="126" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">items 元组</text>
<text x="185.0" y="155" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">持有元素的强引用</text>
<rect x="675" y="95" width="280" height="90" rx="14" fill="#F3F0FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="815.0" y="126" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">Python 调用者</text>
<text x="815.0" y="155" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">接收返回的新强引用</text>
<rect x="350" y="285" width="300" height="80" rx="14" fill="#EFF8F4" stroke="#597AAA" stroke-width="1.7"/>
<text x="500.0" y="316" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">同一个元素对象</text>
<text x="500.0" y="345" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">没有复制一份新元素</text>
<path d="M220,185 L405,285" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="312.5" y="225.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">元组元素引用</text>
<path d="M815,185 L595,285" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="705.0" y="225.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">返回值引用</text>
<rect x="365" y="95" width="260" height="90" rx="14" fill="#F5F7FC" stroke="#597AAA" stroke-width="1.7"/>
<text x="495.0" y="126" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">item 指针</text>
<text x="495.0" y="155" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">GetItem 的借用引用</text>
<path d="M495,185 L495,285" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="495.0" y="225.0" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">只借用</text>
<text x="40" y="415" font-size="17" text-anchor="start" font-weight="400" fill="#20365F">成功取得非 NULL 元素后，Py_NewRef(item) 把新强引用交给调用者；不随意 DECREF 借用。</text>
</g></svg>
