<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">可变类属性：两个实例找到同一个列表</title><desc id="desc">first 与 second 通过类属性共同引用 titles。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597AAA"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20365F">
<text x="40" y="42" font-size="27" text-anchor="start" font-weight="600" fill="#20365F">可变类属性：两个实例找到同一个列表</text>
<rect x="50" y="100" width="300" height="85" rx="14" fill="#ECF3FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="200.0" y="131" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">first</text>
<text x="200.0" y="160" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">owner = 小林</text>
<rect x="650" y="100" width="300" height="85" rx="14" fill="#F3F0FF" stroke="#597AAA" stroke-width="1.7"/>
<text x="800.0" y="131" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">second</text>
<text x="800.0" y="160" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">owner = 小周</text>
<rect x="305" y="270" width="390" height="95" rx="14" fill="#EFF8F4" stroke="#597AAA" stroke-width="1.7"/>
<text x="500.0" y="301" font-size="19" text-anchor="middle" font-weight="600" fill="#20365F">BadReadingList.titles</text>
<text x="500.0" y="330" font-size="17" text-anchor="middle" font-weight="400" fill="#20365F">同一个列表对象</text>
<path d="M200,185 L390,270" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="295.0" y="217.5" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">查找 titles</text>
<path d="M800,185 L610,270" fill="none" stroke="#597AAA" stroke-width="2" marker-end="url(#arrow)"/>
<text x="705.0" y="217.5" font-size="16" text-anchor="middle" font-weight="400" fill="#20365F">查找 titles</text>
<text x="500" y="225" font-size="20" text-anchor="middle" font-weight="600" fill="#20365F">append 修改找到的列表</text>
<text x="40" y="415" font-size="17" text-anchor="start" font-weight="400" fill="#20365F">为每个实例在 __init__ 中创建 self.titles = []，才能得到各自独立的列表。</text>
</g></svg>
