<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">多个视图观察同一缓冲区</title><desc id="desc">每格一个字节；本例使用 Uint8Array，所以元素长度与字节长度数值相同。</desc>
<metadata>Original illustration by CMYK Labs (cmyk-labs); CC BY-NC-SA 4.0.</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#5374AB"/></marker></defs>
<rect width="960" height="380" fill="white"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#20365F">
<text x="32" y="40" font-size="26" text-anchor="start" fill="#20365F" font-weight="700">多个视图观察同一缓冲区</text>
<text x="32" y="72" font-size="15" text-anchor="start" fill="#20365F">每格一个字节；本例使用 Uint8Array，所以元素长度与字节长度数值相同。</text>
<rect x="75" y="153" width="90" height="65" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="120.0" y="191.5" font-size="19" text-anchor="middle" fill="#20365F" font-weight="700">0</text>
<text x="120" y="140" font-size="15" text-anchor="middle" fill="#20365F">0</text>
<rect x="175" y="153" width="90" height="65" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="220.0" y="191.5" font-size="19" text-anchor="middle" fill="#20365F" font-weight="700">0</text>
<text x="220" y="140" font-size="15" text-anchor="middle" fill="#20365F">1</text>
<rect x="275" y="153" width="90" height="65" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="320.0" y="191.5" font-size="19" text-anchor="middle" fill="#20365F" font-weight="700">70</text>
<text x="320" y="140" font-size="15" text-anchor="middle" fill="#20365F">2</text>
<rect x="375" y="153" width="90" height="65" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="420.0" y="191.5" font-size="19" text-anchor="middle" fill="#20365F" font-weight="700">0</text>
<text x="420" y="140" font-size="15" text-anchor="middle" fill="#20365F">3</text>
<rect x="475" y="153" width="90" height="65" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="520.0" y="191.5" font-size="19" text-anchor="middle" fill="#20365F" font-weight="700">0</text>
<text x="520" y="140" font-size="15" text-anchor="middle" fill="#20365F">4</text>
<rect x="575" y="153" width="90" height="65" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="620.0" y="191.5" font-size="19" text-anchor="middle" fill="#20365F" font-weight="700">0</text>
<text x="620" y="140" font-size="15" text-anchor="middle" fill="#20365F">5</text>
<rect x="675" y="153" width="90" height="65" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="720.0" y="191.5" font-size="19" text-anchor="middle" fill="#20365F" font-weight="700">0</text>
<text x="720" y="140" font-size="15" text-anchor="middle" fill="#20365F">6</text>
<rect x="775" y="153" width="90" height="65" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="820.0" y="191.5" font-size="19" text-anchor="middle" fill="#20365F" font-weight="700">0</text>
<text x="820" y="140" font-size="15" text-anchor="middle" fill="#20365F">7</text>
<text x="32" y="120" font-size="16" text-anchor="start" fill="#20365F">字节偏移</text>
<rect x="75" y="267" width="790" height="48" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="470.0" y="297.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">bytes：覆盖 0–7，共 8 个元素</text>
<rect x="275" y="90" width="290" height="35" rx="12" fill="#F3F0FF" stroke="#AA9BDE" stroke-width="1.8"/>
<text x="420.0" y="113.5" font-size="15" text-anchor="middle" fill="#20365F" font-weight="700">tail：从偏移 2 开始，长 3</text>
<polyline points="420,125 420,153" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="32" y="360" font-size="15" text-anchor="start" fill="#20365F">tail[0] 与 bytes[2] 是同一字节。slice 创建副本；subarray 保留共享存储。</text>
</g></svg>
