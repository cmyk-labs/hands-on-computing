<svg xmlns="http://www.w3.org/2000/svg" width="960" height="365" viewBox="0 0 960 365" role="img" aria-labelledby="title desc">
<title id="title">浅拷贝复制外层，嵌套对象仍共享</title><desc id="desc">对象展开与 Object.assign 的这一层引用关系相同。</desc>
<metadata>Original illustration by CMYK Labs (cmyk-labs); CC BY-NC-SA 4.0.</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#5374AB"/></marker></defs>
<rect width="960" height="365" fill="white"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#20365F">
<text x="32" y="40" font-size="26" text-anchor="start" fill="#20365F" font-weight="700">浅拷贝复制外层，嵌套对象仍共享</text>
<text x="32" y="72" font-size="15" text-anchor="start" fill="#20365F">对象展开与 Object.assign 的这一层引用关系相同。</text>
<rect x="40" y="115" width="250" height="68" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="165.0" y="142.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">original</text>
<text x="165.0" y="168.0" font-size="18" text-anchor="middle" fill="#20365F">nested</text>
<rect x="355" y="115" width="250" height="68" rx="12" fill="#F3F0FF" stroke="#AA9BDE" stroke-width="1.8"/>
<text x="480.0" y="142.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">shallow</text>
<text x="480.0" y="168.0" font-size="18" text-anchor="middle" fill="#20365F">nested</text>
<rect x="670" y="115" width="250" height="68" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="795.0" y="142.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">isolated</text>
<text x="795.0" y="168.0" font-size="18" text-anchor="middle" fill="#20365F">nested</text>
<rect x="190" y="255" width="280" height="68" rx="12" fill="#F3F0FF" stroke="#AA9BDE" stroke-width="1.8"/>
<text x="330.0" y="282.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">共享的 nested</text>
<text x="330.0" y="308.0" font-size="18" text-anchor="middle" fill="#20365F">count: 1 → 2</text>
<rect x="670" y="255" width="250" height="68" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="795.0" y="282.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">独立的 nested</text>
<text x="795.0" y="308.0" font-size="18" text-anchor="middle" fill="#20365F">count: 2 → 9</text>
<polyline points="165,183 165,220 260,255" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="480,183 480,220 400,255" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="795,183 795,255" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="32" y="345" font-size="15" text-anchor="start" fill="#20365F">三个外层对象不同；只有显式展开 nested 的 isolated 隔离了本例这一层修改。</text>
</g></svg>
