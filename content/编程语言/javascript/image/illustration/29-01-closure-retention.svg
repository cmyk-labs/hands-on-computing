<svg xmlns="http://www.w3.org/2000/svg" width="960" height="355" viewBox="0 0 960 355" role="img" aria-labelledby="title desc">
<title id="title">清空一个变量，不等于断开所有引用</title><desc id="desc">箭头表示本例仍然存在的强引用关系；图定格在 rows = null 之后。</desc>
<metadata>Original illustration by CMYK Labs (cmyk-labs); CC BY-NC-SA 4.0.</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#5374AB"/></marker></defs>
<rect width="960" height="355" fill="white"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#20365F">
<text x="32" y="40" font-size="26" text-anchor="start" fill="#20365F" font-weight="700">清空一个变量，不等于断开所有引用</text>
<text x="32" y="72" font-size="15" text-anchor="start" fill="#20365F">箭头表示本例仍然存在的强引用关系；图定格在 rows = null 之后。</text>
<rect x="30" y="140" width="205" height="80" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="132.5" y="173.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">cache</text>
<text x="132.5" y="199.0" font-size="17" text-anchor="middle" fill="#20365F">Map 的 report 项</text>
<rect x="330" y="140" width="245" height="80" rx="12" fill="#F3F0FF" stroke="#AA9BDE" stroke-width="1.8"/>
<text x="452.5" y="173.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">读取器闭包</text>
<text x="452.5" y="199.0" font-size="17" text-anchor="middle" fill="#20365F">保留形参 rows</text>
<rect x="670" y="140" width="255" height="80" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="797.5" y="173.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">原数组</text>
<text x="797.5" y="199.0" font-size="17" text-anchor="middle" fill="#20365F">1000 个元素</text>
<polyline points="235,180 330,180" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="575,180 670,180" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="30" y="275" width="350" height="48" rx="12" fill="#F7F9FC" stroke="#AAB9CE" stroke-width="1.8"/>
<text x="205.0" y="305.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">外层 rows → null</text>
<text x="430" y="305" font-size="16" text-anchor="start" fill="#20365F">cache.clear() 断开左上方缓存持有关系</text>
<text x="32" y="335" font-size="15" text-anchor="start" fill="#20365F">断开最后的可达路径不等于已观察到 GC 完成；不承诺回收时刻或归还系统的字节数。</text>
</g></svg>
