<text x="772.5" y="175.0" font-size="17" text-anchor="middle" fill="#20365F">静态 kind</text>
<rect x="170" y="255" width="260" height="62" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="300.0" y="279.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">Lab.prototype</text>
<text x="300.0" y="305.0" font-size="17" text-anchor="middle" fill="#20365F">describe</text>
<rect x="640" y="255" width="265" height="62" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="772.5" y="279.0" font-size="17" text-anchor="middle" fill="#20365F" font-weight="700">Lesson.prototype</text>
<text x="772.5" y="305.0" font-size="17" text-anchor="middle" fill="#20365F">describe</text>
<polyline points="430,156 640,156" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="535" y="142" font-size="15" text-anchor="middle" fill="#20365F">静态成员查找</text>
<polyline points="430,286 640,286" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="535" y="272" font-size="15" text-anchor="middle" fill="#20365F">实例方法查找</text>
<polyline points="300,187 300,255" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<polyline points="772,187 772,255" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="35" y="285" font-size="18" text-anchor="start" fill="#20365F">lab</text>
<polyline points="65,281 170,281" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="32" y="335" font-size="15" text-anchor="start" fill="#20365F">省略两条链的后续对象。super.describe() 找到父类方法后，调用接收者仍是 lab。</text>
</g></svg>
