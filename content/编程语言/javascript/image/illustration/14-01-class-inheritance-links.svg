<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#5374AB"/></marker></defs>
<rect width="960" height="355" fill="white"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#20365F">
<text x="32" y="40" font-size="26" text-anchor="start" fill="#20365F" font-weight="700">extends 同时连接两条继承关系</text>
<text x="32" y="72" font-size="15" text-anchor="start" fill="#20365F">纵向虚线是 prototype 属性；横向实线是对象的原型关系。</text>
<rect x="170" y="125" width="260" height="62" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
