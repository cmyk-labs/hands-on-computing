<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">A🚀B：索引按码元计数</title><desc id="desc">同一字符串可以按 UTF-16 码元或 Unicode 码点观察。</desc>
<metadata>Original illustration by CMYK Labs (cmyk-labs); CC BY-NC-SA 4.0.</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#5374AB"/></marker></defs>
<rect width="960" height="340" fill="white"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#20365F">
<text x="32" y="40" font-size="26" text-anchor="start" fill="#20365F" font-weight="700">A🚀B：索引按码元计数</text>
<text x="32" y="72" font-size="15" text-anchor="start" fill="#20365F">同一字符串可以按 UTF-16 码元或 Unicode 码点观察。</text>
<text x="210" y="113" font-size="16" text-anchor="middle" fill="#20365F">索引 0</text>
<rect x="130" y="130" width="160" height="60" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="210.0" y="166.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">0041</text>
<text x="390" y="113" font-size="16" text-anchor="middle" fill="#20365F">索引 1</text>
<rect x="310" y="130" width="160" height="60" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="390.0" y="166.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">D83D</text>
<text x="570" y="113" font-size="16" text-anchor="middle" fill="#20365F">索引 2</text>
<rect x="490" y="130" width="160" height="60" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="570.0" y="166.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">DE80</text>
<text x="750" y="113" font-size="16" text-anchor="middle" fill="#20365F">索引 3</text>
<rect x="670" y="130" width="160" height="60" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="750.0" y="166.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">0042</text>
<rect x="130" y="245" width="160" height="55" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="210.0" y="278.5" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">U+0041</text>
<rect x="310" y="245" width="340" height="55" rx="12" fill="#F3F0FF" stroke="#AA9BDE" stroke-width="1.8"/>
<text x="480.0" y="278.5" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">U+1F680：一个码点</text>
<rect x="670" y="245" width="160" height="55" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="750.0" y="278.5" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">U+0042</text>
<polyline points="210,190 210,245" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="480,190 480,245" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="750,190 750,245" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="32" y="320" font-size="15" text-anchor="start" fill="#20365F">length = 4；for...of 迭代 3 个码点。码点仍不等于所有文本中的可见字符。</text>
</g></svg>
