<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
<title id="title">相同函数，接收者由调用形式决定</title><desc id="desc">以下三行都是 ES 模块中的普通严格函数调用。</desc>
<metadata>Original illustration by CMYK Labs (cmyk-labs); CC BY-NC-SA 4.0.</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#5374AB"/></marker></defs>
<rect width="960" height="330" fill="white"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#20365F">
<text x="32" y="40" font-size="26" text-anchor="start" fill="#20365F" font-weight="700">相同函数，接收者由调用形式决定</text>
<text x="32" y="72" font-size="15" text-anchor="start" fill="#20365F">以下三行都是 ES 模块中的普通严格函数调用。</text>
<rect x="50" y="115" width="340" height="52" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="220.0" y="147.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">first.receiver()</text>
<rect x="610" y="115" width="300" height="52" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="760.0" y="147.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">this = first</text>
<polyline points="390,141 610,141" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="133" font-size="15" text-anchor="middle" fill="#20365F">调用形式</text>
<rect x="50" y="188" width="340" height="52" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="220.0" y="220.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">second.receiver()</text>
<rect x="610" y="188" width="300" height="52" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="760.0" y="220.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">this = second</text>
<polyline points="390,214 610,214" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="206" font-size="15" text-anchor="middle" fill="#20365F">调用形式</text>
<rect x="50" y="261" width="340" height="52" rx="12" fill="#F3F0FF" stroke="#AA9BDE" stroke-width="1.8"/>
<text x="220.0" y="293.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">detached()</text>
<rect x="610" y="261" width="300" height="52" rx="12" fill="#F3F0FF" stroke="#AA9BDE" stroke-width="1.8"/>
<text x="760.0" y="293.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">this = undefined</text>
<polyline points="390,287 610,287" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="279" font-size="15" text-anchor="middle" fill="#20365F">调用形式</text>
</g></svg>
