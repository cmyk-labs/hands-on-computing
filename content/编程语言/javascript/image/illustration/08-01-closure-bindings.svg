<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">每次调用创建各自的计数绑定</title><desc id="desc">返回函数继续访问创建它的那次 makeCounter 调用中的 count。</desc>
<metadata>Original illustration by CMYK Labs (cmyk-labs); CC BY-NC-SA 4.0.</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#5374AB"/></marker></defs>
<rect width="960" height="340" fill="white"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#20365F">
<text x="32" y="40" font-size="26" text-anchor="start" fill="#20365F" font-weight="700">每次调用创建各自的计数绑定</text>
<text x="32" y="72" font-size="15" text-anchor="start" fill="#20365F">返回函数继续访问创建它的那次 makeCounter 调用中的 count。</text>
<rect x="40" y="130" width="210" height="70" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="145.0" y="158.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">first</text>
<text x="145.0" y="184.0" font-size="18" text-anchor="middle" fill="#20365F">返回的函数</text>
<rect x="350" y="130" width="255" height="70" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="477.5" y="158.0" font-size="16" text-anchor="middle" fill="#20365F" font-weight="700">第一次调用的环境</text>
<text x="477.5" y="184.0" font-size="16" text-anchor="middle" fill="#20365F">count: 0 → 1 → 2 → 3</text>
<rect x="40" y="230" width="210" height="70" rx="12" fill="#F3F0FF" stroke="#AA9BDE" stroke-width="1.8"/>
<text x="145.0" y="258.0" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">second</text>
<text x="145.0" y="284.0" font-size="18" text-anchor="middle" fill="#20365F">返回的函数</text>
<rect x="350" y="230" width="255" height="70" rx="12" fill="#F3F0FF" stroke="#AA9BDE" stroke-width="1.8"/>
<text x="477.5" y="258.0" font-size="16" text-anchor="middle" fill="#20365F" font-weight="700">第二次调用的环境</text>
<text x="477.5" y="284.0" font-size="16" text-anchor="middle" fill="#20365F">count: 10 → 11</text>
<polyline points="250,165 350,165" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="250,265 350,265" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="645" y="165" font-size="16" text-anchor="start" fill="#20365F">first() 多次更新同一绑定</text>
<text x="645" y="265" font-size="16" text-anchor="start" fill="#20365F">second() 使用另一绑定</text>
<text x="32" y="320" font-size="15" text-anchor="start" fill="#20365F">这是词法绑定关系示意，不是引擎必须采用的存储结构。</text>
</g></svg>
