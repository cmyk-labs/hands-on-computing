<svg xmlns="http://www.w3.org/2000/svg" width="960" height="335" viewBox="0 0 960 335" role="img" aria-labelledby="title desc">
<title id="title">资源按登记的逆序释放</title><desc id="desc">同步 using：返回给调用者之前，先完成本作用域已登记的释放。</desc>
<metadata>Original illustration by CMYK Labs (cmyk-labs); CC BY-NC-SA 4.0.</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#5374AB"/></marker></defs>
<rect width="960" height="335" fill="white"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#20365F">
<text x="32" y="40" font-size="26" text-anchor="start" fill="#20365F" font-weight="700">资源按登记的逆序释放</text>
<text x="32" y="72" font-size="15" text-anchor="start" fill="#20365F">同步 using：返回给调用者之前，先完成本作用域已登记的释放。</text>
<text x="40" y="116" font-size="17" text-anchor="start" fill="#20365F" font-weight="700">登记顺序</text>
<text x="40" y="252" font-size="17" text-anchor="start" fill="#20365F" font-weight="700">离开范围</text>
<rect x="210" y="90" width="200" height="55" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="310.0" y="123.5" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">file</text>
<rect x="500" y="90" width="200" height="55" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="600.0" y="123.5" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">marker</text>
<polyline points="410,117 500,117" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="760" y="123" font-size="15" text-anchor="start" fill="#20365F">absent = null：无释放动作</text>
<rect x="210" y="220" width="200" height="55" rx="12" fill="#EFF8F4" stroke="#82BEA7" stroke-width="1.8"/>
<text x="310.0" y="253.5" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">释放 marker</text>
<rect x="500" y="220" width="200" height="55" rx="12" fill="#ECF3FF" stroke="#84A6E8" stroke-width="1.8"/>
<text x="600.0" y="253.5" font-size="18" text-anchor="middle" fill="#20365F" font-weight="700">释放 file</text>
<rect x="775" y="220" width="155" height="55" rx="12" fill="#F3F0FF" stroke="#AA9BDE" stroke-width="1.8"/>
<text x="852.5" y="253.5" font-size="16" text-anchor="middle" fill="#20365F" font-weight="700">返回调用者</text>
<polyline points="410,247 500,247" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="700,247 775,247" fill="none" stroke="#5374AB" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="32" y="315" font-size="15" text-anchor="start" fill="#20365F">本图对应同步示例；await using 要等待异步释放，不能直接套用同步清理的时间关系。</text>
</g></svg>
